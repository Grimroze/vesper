<svg width="100%" viewBox="0 0 1000 560" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SQL vs NoSQL Architecture and Decision Matrix</title>
  <desc>System design comparison between Relational SQL and Distributed NoSQL stores with concise storage models and interview decision criteria.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="560" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="80" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">DATABASE PARADIGMS</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">SQL (Relational) vs NoSQL (Distributed)</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Storage architecture, transaction guarantees, and system design interview selection rules</text>
  </g>

  <!-- ==================== LEFT COLUMN: SQL ==================== -->
  <g transform="translate(40, 88)">
    <rect width="445" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Header Pill -->
    <rect x="14" y="14" width="417" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Relational SQL</text>
    <rect x="275" y="19" width="145" height="20" rx="4" fill="#dbeafe"/>
    <text x="347" y="33" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">PostgreSQL / MySQL</text>

    <!-- Schema Mini Tables -->
    <g transform="translate(14, 56)">
      <!-- Table: users -->
      <g transform="translate(0, 0)">
        <rect width="170" height="74" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <rect width="170" height="18" rx="4" fill="#f1f5f9"/>
        <text x="8" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">users</text>
        <text x="8" y="32" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#2563eb">id [PK]</text>
        <text x="8" y="48" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">email</text>
        <text x="8" y="64" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">created_at</text>
      </g>

      <!-- Join Connector -->
      <path d="M 170 32 L 240 32" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>
      <rect x="185" y="22" width="38" height="16" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="204" y="34" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#1d4ed8" text-anchor="middle">JOIN</text>

      <!-- Table: orders -->
      <g transform="translate(245, 0)">
        <rect width="172" height="74" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
        <rect width="172" height="18" rx="4" fill="#f1f5f9"/>
        <text x="8" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">orders</text>
        <text x="8" y="32" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">order_id</text>
        <text x="8" y="48" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#2563eb">user_id [FK]</text>
        <text x="8" y="64" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">amount</text>
      </g>
    </g>

    <!-- Key Characteristics (Concise, no bullet flood) -->
    <g transform="translate(14, 144)">
      <rect width="417" height="98" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563eb">SCHEMA:</text>
        <text x="75" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Strict pre-defined DDL, relational integrity</text>

        <text x="0" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563eb">ACID:</text>
        <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Strong transactions, WAL, 2-phase commit</text>

        <text x="0" y="44" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563eb">SCALING:</text>
        <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Vertical scale-up, read replicas with replication lag</text>

        <text x="0" y="66" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563eb">BEST FOR:</text>
        <text x="75" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Financial ledgers, checkout transactions, ERPs</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: NoSQL ==================== -->
  <g transform="translate(515, 88)">
    <rect width="445" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Header Pill -->
    <rect x="14" y="14" width="417" height="30" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Distributed NoSQL</text>
    <rect x="275" y="19" width="145" height="20" rx="4" fill="#fef3c7"/>
    <text x="347" y="33" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#b45309" text-anchor="middle">Mongo / Redis / Cassandra</text>

    <!-- 4 NoSQL Archetype Pills -->
    <g transform="translate(14, 56)">
      <!-- Document -->
      <g transform="translate(0, 0)">
        <rect width="202" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="8" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">Document (JSON):</text>
        <text x="8" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">MongoDB (Flexible schema)</text>
      </g>

      <!-- Key-Value -->
      <g transform="translate(214, 0)">
        <rect width="203" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="8" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">Key-Value (RAM):</text>
        <text x="8" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Redis (O(1) sub-ms lookups)</text>
      </g>

      <!-- Wide-Column -->
      <g transform="translate(0, 40)">
        <rect width="202" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="8" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">Wide-Column (LSM):</text>
        <text x="8" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Cassandra (High write ingest)</text>
      </g>

      <!-- Graph -->
      <g transform="translate(214, 40)">
        <rect width="203" height="34" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="8" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">Graph (Nodes/Edges):</text>
        <text x="8" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Neo4j (Multi-hop relations)</text>
      </g>
    </g>

    <!-- Key Characteristics -->
    <g transform="translate(14, 144)">
      <rect width="417" height="98" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b45309">SCHEMA:</text>
        <text x="75" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Dynamic / Schemaless, embedded documents</text>

        <text x="0" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b45309">BASE:</text>
        <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Eventual consistency, high partition tolerance</text>

        <text x="0" y="44" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b45309">SCALING:</text>
        <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Horizontal scale-out via consistent hashing</text>

        <text x="0" y="66" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b45309">BEST FOR:</text>
        <text x="75" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Large-scale telemetry, session caching, social graphs</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM INTERVIEW DECISION TILES ==================== -->
  <g transform="translate(40, 362)">
    <rect width="920" height="174" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#334155">INTERVIEW SELECTION MATRIX</text>

    <!-- 5 Clean Decision Cards -->
    <g transform="translate(16, 34)">
      <!-- Tile 1: SQL -->
      <g transform="translate(0, 0)">
        <rect width="168" height="122" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="168" height="20" rx="6" fill="#eff6ff"/>
        <text x="84" y="14" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">ACID &amp; JOINS</text>
        
        <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">When to use:</text>
        <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Strict consistency</text>
        <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Multi-table relations</text>
        
        <line x1="10" y1="78" x2="158" y2="78" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="94" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
        <text x="10" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">Finance, Orders</text>
      </g>

      <!-- Tile 2: MongoDB -->
      <g transform="translate(180, 0)">
        <rect width="168" height="122" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="168" height="20" rx="6" fill="#f0fdf4"/>
        <text x="84" y="14" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">DYNAMIC JSON</text>

        <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">When to use:</text>
        <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Nested documents</text>
        <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Rapid schema change</text>

        <line x1="10" y1="78" x2="158" y2="78" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="94" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#15803d">MongoDB</text>
        <text x="10" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">Catalogs, CMS</text>
      </g>

      <!-- Tile 3: Redis -->
      <g transform="translate(360, 0)">
        <rect width="168" height="122" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="168" height="20" rx="6" fill="#fef2f2"/>
        <text x="84" y="14" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">SUB-MS CACHE</text>

        <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">When to use:</text>
        <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">In-memory speed</text>
        <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Simple key-value</text>

        <line x1="10" y1="78" x2="158" y2="78" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="94" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#991b1b">Redis</text>
        <text x="10" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">Sessions, Limits</text>
      </g>

      <!-- Tile 4: Cassandra -->
      <g transform="translate(540, 0)">
        <rect width="168" height="122" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="168" height="20" rx="6" fill="#fffbeb"/>
        <text x="84" y="14" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">WRITE HEAVY</text>

        <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">When to use:</text>
        <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Massive write scale</text>
        <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Time-series data</text>

        <line x1="10" y1="78" x2="158" y2="78" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="94" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#92400e">Cassandra</text>
        <text x="10" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">IoT, Event Logs</text>
      </g>

      <!-- Tile 5: Neo4j -->
      <g transform="translate(720, 0)">
        <rect width="168" height="122" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="168" height="20" rx="6" fill="#faf5ff"/>
        <text x="84" y="14" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#7e22ce" text-anchor="middle">GRAPH TRAVERSAL</text>

        <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#0f172a">When to use:</text>
        <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Multi-hop queries</text>
        <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#475569">Connected networks</text>

        <line x1="10" y1="78" x2="158" y2="78" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="94" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#6b21a8">Neo4j</text>
        <text x="10" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#64748b">Social, Fraud Rings</text>
      </g>
    </g>
  </g>
</svg>