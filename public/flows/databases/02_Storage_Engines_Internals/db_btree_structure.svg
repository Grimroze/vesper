<svg width="100%" viewBox="0 0 1000 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>B+ Tree Index Architecture</title>
  <desc>B+ Tree storage engine structure with internal routing nodes, query traversal path, and doubly-linked leaf nodes for range scans.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-active" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-prev" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="520" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="90" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">STORAGE ENGINE INDEX</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">B+ Tree Index Architecture</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Internal pages route lookups; leaf pages store sorted data and link together for range queries</text>
  </g>

  <!-- Top Right Query Trace Badge -->
  <g transform="translate(680, 24)">
    <rect width="280" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="17" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#2563eb">Query Trace: id = 42</text>
    <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#475569">Root (P1) -> Internal (P1) -> Leaf Page 3</text>
  </g>

  <!-- ==================== ROOT NODE ==================== -->
  <g transform="translate(385, 88)">
    <rect width="230" height="52" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="230" height="18" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="115" y="13" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">ROOT PAGE</text>

    <!-- Slots: P0, Key 28, P1, Key 65, P2 -->
    <g transform="translate(10, 22)">
      <rect x="0" y="0" width="30" height="24" rx="3" fill="#e2e8f0"/>
      <text x="15" y="16" font-family="ui-monospace, monospace" font-size="10" fill="#475569" text-anchor="middle">P0</text>

      <rect x="34" y="0" width="54" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="61" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">28</text>

      <!-- Active P1 -->
      <rect x="92" y="0" width="30" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
      <text x="107" y="16" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">P1</text>

      <rect x="126" y="0" width="54" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="153" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">65</text>

      <rect x="184" y="0" width="26" height="24" rx="3" fill="#e2e8f0"/>
      <text x="197" y="16" font-family="ui-monospace, monospace" font-size="10" fill="#475569" text-anchor="middle">P2</text>
    </g>
  </g>

  <!-- Pointers from Root -->
  <path d="M 400 140 C 400 160, 160 160, 160 178" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="260" y="156" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">keys &lt; 28</text>

  <path d="M 500 140 L 500 176" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-active)"/>
  <rect x="445" y="148" width="110" height="16" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="500" y="160" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">28 &lt;= 42 &lt; 65</text>

  <path d="M 590 140 C 590 160, 840 160, 840 178" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="730" y="156" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">keys &gt;= 65</text>

  <!-- ==================== INTERNAL NODES ==================== -->
  <!-- Left Internal Node -->
  <g transform="translate(60, 182)">
    <rect width="200" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">INTERNAL: keys &lt; 28</text>
    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="24" height="20" rx="3" fill="#e2e8f0"/><text x="12" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P0</text>
      <rect x="28" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">10</text>
      <rect x="77" y="0" width="24" height="20" rx="3" fill="#e2e8f0"/><text x="89" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P1</text>
      <rect x="105" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="127" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">20</text>
      <rect x="154" y="0" width="26" height="20" rx="3" fill="#e2e8f0"/><text x="167" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P2</text>
    </g>
  </g>

  <!-- Middle Internal Node (Active) -->
  <g transform="translate(400, 182)">
    <rect width="200" height="48" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <text x="100" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">INTERNAL: 28 to 64</text>
    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="24" height="20" rx="3" fill="#e2e8f0"/><text x="12" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P0</text>
      <rect x="28" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">38</text>
      <!-- Active P1 -->
      <rect x="77" y="0" width="24" height="20" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><text x="89" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">P1</text>
      <rect x="105" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="127" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">50</text>
      <rect x="154" y="0" width="26" height="20" rx="3" fill="#e2e8f0"/><text x="167" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P2</text>
    </g>
  </g>

  <!-- Right Internal Node -->
  <g transform="translate(740, 182)">
    <rect width="200" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">INTERNAL: keys &gt;= 65</text>
    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="24" height="20" rx="3" fill="#e2e8f0"/><text x="12" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P0</text>
      <rect x="28" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">78</text>
      <rect x="77" y="0" width="24" height="20" rx="3" fill="#e2e8f0"/><text x="89" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P1</text>
      <rect x="105" y="0" width="45" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="127" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">90</text>
      <rect x="154" y="0" width="26" height="20" rx="3" fill="#e2e8f0"/><text x="167" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">P2</text>
    </g>
  </g>

  <!-- Pointers to Leaves -->
  <path d="M 80 230 L 80 270" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 220 230 L 220 270" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Active pointer to Leaf 3 -->
  <path d="M 500 230 L 500 270" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-active)"/>
  <rect x="450" y="242" width="100" height="15" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="500" y="253" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">38 &lt;= 42 &lt; 50</text>

  <path d="M 570 230 L 590 270" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 760 230 L 760 270" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 910 230 L 910 270" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Leaf Connection Banner -->
  <g transform="translate(40, 268)">
    <rect width="920" height="18" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="460" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">
      LEAF PAGES HOLD ACTUAL DATA ROWS -- LINKED HORIZONTALLY (PREV / NEXT) FOR FAST RANGE SCANS
    </text>
  </g>

  <!-- ==================== LEAF NODES ==================== -->
  <!-- Leaf 1 -->
  <g transform="translate(40, 296)">
    <rect width="135" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="135" height="18" rx="6" fill="#f1f5f9"/>
    <text x="67" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Leaf 1</text>
    <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[3] data</text>
    <text x="12" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[5] data</text>
    <text x="12" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[8] data</text>
    <text x="12" y="82" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">next -&gt;</text>
  </g>

  <!-- Leaf 2 -->
  <g transform="translate(195, 296)">
    <rect width="135" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="135" height="18" rx="6" fill="#f1f5f9"/>
    <text x="67" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Leaf 2</text>
    <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[10] data</text>
    <text x="12" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[18] data</text>
    <text x="12" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[24] data</text>
    <text x="12" y="82" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">&lt;- prev | next -&gt;</text>
  </g>

  <!-- Leaf 3 (TARGET FOUND) -->
  <g transform="translate(350, 296)">
    <rect width="150" height="90" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <rect width="150" height="18" rx="6" fill="#dcfce7"/>
    <text x="75" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">Leaf 3 (Target Found)</text>
    <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#475569">[28] data</text>
    
    <!-- Target Highlight -->
    <rect x="8" y="42" width="134" height="16" rx="3" fill="#2563eb"/>
    <text x="14" y="54" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff">[42] Match Found</text>
    
    <text x="12" y="70" font-family="ui-monospace, monospace" font-size="10" fill="#475569">[48] data</text>
    <text x="12" y="84" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#15803d">Scan next -&gt;</text>
  </g>

  <!-- Leaf 4 -->
  <g transform="translate(520, 296)">
    <rect width="135" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="135" height="18" rx="6" fill="#f1f5f9"/>
    <text x="67" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Leaf 4</text>
    <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[50] data</text>
    <text x="12" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[55] data</text>
    <text x="12" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[62] data</text>
    <text x="12" y="82" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">&lt;- prev | next -&gt;</text>
  </g>

  <!-- Leaf 5 -->
  <g transform="translate(675, 296)">
    <rect width="135" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="135" height="18" rx="6" fill="#f1f5f9"/>
    <text x="67" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Leaf 5</text>
    <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[65] data</text>
    <text x="12" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[70] data</text>
    <text x="12" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[75] data</text>
    <text x="12" y="82" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">&lt;- prev | next -&gt;</text>
  </g>

  <!-- Leaf 6 -->
  <g transform="translate(825, 296)">
    <rect width="135" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="135" height="18" rx="6" fill="#f1f5f9"/>
    <text x="67" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Leaf 6</text>
    <text x="12" y="36" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[78] data</text>
    <text x="12" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[88] data</text>
    <text x="12" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#0f172a">[99] data</text>
    <text x="12" y="82" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">&lt;- prev</text>
  </g>

  <!-- Horizontal Doubly-Linked Connectors -->
  <path d="M 175 345 L 193 345" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 330 345 L 348 345" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 500 345 L 518 345" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 655 345 L 673 345" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 810 345 L 823 345" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- ==================== CLEAN BOTTOM CARDS (NO EMOJIS, NO TEXT FLOOD) ==================== -->
  <g transform="translate(40, 405)">
    <!-- Card 1: Point Lookups -->
    <g transform="translate(0, 0)">
      <rect width="285" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#eff6ff"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">POINT READS</text>
      <text x="100" y="23" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">O(log N)</text>
      
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#334155">Shallow Tree Depth (3 to 4 levels)</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">Only 3-4 disk page seeks to locate any key</text>
    </g>

    <!-- Card 2: Range Scans -->
    <g transform="translate(315, 0)">
      <rect width="285" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#f0fdf4"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">RANGE SCANS</text>
      <text x="100" y="23" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">O(log N + K)</text>

      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#334155">Sequential Leaf Traversal</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">Follows leaf next-pointers without tree re-walk</text>
    </g>

    <!-- Card 3: In-Place Writes -->
    <g transform="translate(635, 0)">
      <rect width="285" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#fffbeb"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">IN-PLACE WRITES</text>
      <text x="100" y="23" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0f172a">Random I/O</text>

      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#334155">Page Splits on Full Blocks</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">Updates existing pages; requires WAL logging</text>
    </g>
  </g>
</svg>