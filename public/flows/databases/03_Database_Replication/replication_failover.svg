<svg width="100%" viewBox="0 0 960 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Database Replication Failover and Leader Election</title>
  <desc>Step-by-step failure recovery showing heartbeat loss, quorum consensus election, promotion to new leader, and replica reconfiguration.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="80" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">FAILOVER LIFECYCLE</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Leader Failover &amp; Automatic Election</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Crash detection, consensus voting, role promotion, and replica re-attachment</text>
  </g>

  <!-- ==================== 4 SEQUENTIAL PHASES ==================== -->
  <g transform="translate(40, 92)">
    
    <!-- Step 1: Crash & Heartbeat Detection -->
    <g transform="translate(0, 0)">
      <rect width="205" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="205" height="26" rx="8" fill="#fef2f2"/>
      <text x="102" y="17" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">STEP 1: CRASH DETECTED</text>

      <!-- Old Leader Node with Red Cross -->
      <g transform="translate(32, 40)">
        <path d="M 0 10 C 0 5, 140 5, 140 10 L 140 55 C 140 60, 0 60, 0 55 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
        <ellipse cx="70" cy="10" rx="70" ry="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
        <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Old Leader</text>
        <text x="70" y="46" font-family="ui-monospace, monospace" font-size="8.5" fill="#dc2626" text-anchor="middle">[UNRESPONSIVE]</text>
        <!-- Red Cross -->
        <line x1="50" y1="20" x2="90" y2="45" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="90" y1="20" x2="50" y2="45" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Description lines -->
      <g transform="translate(14, 120)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Heartbeat Timeout</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Leader misses 3 heartbeats</text>
        <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Sentinel nodes declare dead</text>
        <rect x="0" y="60" width="177" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="8" y="76" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#dc2626">Trigger: Failover initiated</text>
        <text x="8" y="90" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Writes blocked temporarily</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 210 160 L 220 160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Step 2: Consensus Election -->
    <g transform="translate(225, 0)">
      <rect width="205" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="205" height="26" rx="8" fill="#fffbeb"/>
      <text x="102" y="17" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#d97706" text-anchor="middle">STEP 2: QUORUM VOTE</text>

      <!-- Consensus Box -->
      <g transform="translate(22, 40)">
        <rect width="160" height="58" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
        <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Raft / Paxos Election</text>
        <text x="80" y="42" font-family="ui-monospace, monospace" font-size="8.5" fill="#78350f" text-anchor="middle">Compare Log Offsets</text>
      </g>

      <!-- Description lines -->
      <g transform="translate(14, 120)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Find Most Up-To-Date</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Selects highest LSN/offset</text>
        <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Minimizes data rollback</text>
        <rect x="0" y="60" width="177" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="8" y="76" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#d97706">Winner: Follower 1</text>
        <text x="8" y="90" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Quorum majority agreed</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 435 160 L 445 160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Step 3: Role Promotion -->
    <g transform="translate(450, 0)">
      <rect width="205" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="205" height="26" rx="8" fill="#f0fdf4"/>
      <text x="102" y="17" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">STEP 3: PROMOTION</text>

      <!-- Promoted Leader Node -->
      <g transform="translate(32, 40)">
        <path d="M 0 10 C 0 5, 140 5, 140 10 L 140 55 C 140 60, 0 60, 0 55 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <ellipse cx="70" cy="10" rx="70" ry="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
        <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">New Leader</text>
        <text x="70" y="46" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534" text-anchor="middle">Read-Write Enabled</text>
      </g>

      <!-- Description lines -->
      <g transform="translate(14, 120)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Mode Switch</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Follower 1 promoted</text>
        <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Switches from RO to RW</text>
        <rect x="0" y="60" width="177" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="8" y="76" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#15803d">Status: Writes Resumed</text>
        <text x="8" y="90" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">New epoch/term begins</text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 660 160 L 670 160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Step 4: Reconfiguration -->
    <g transform="translate(675, 0)">
      <rect width="205" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="205" height="26" rx="8" fill="#eff6ff"/>
      <text x="102" y="17" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">STEP 4: RE-POINT</text>

      <!-- Follower Re-point Box -->
      <g transform="translate(22, 40)">
        <rect width="160" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Follower 2 Re-points</text>
        <text x="80" y="42" font-family="ui-monospace, monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">Replicates from New Leader</text>
      </g>

      <!-- Description lines -->
      <g transform="translate(14, 120)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">Client Traffic Update</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">DNS / Proxy config updated</text>
        <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Clients write to New Leader</text>
        <rect x="0" y="60" width="177" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="8" y="76" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#1d4ed8">Topology: Restored</text>
        <text x="8" y="90" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Full replication active</text>
      </g>
    </g>

  </g>

  <!-- ==================== BOTTOM ARCHITECTURAL TRADEOFFS ==================== -->
  <g transform="translate(40, 365)">
    <rect width="880" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Left Box: Split-Brain -->
    <g transform="translate(16, 14)">
      <rect width="410" height="62" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#dc2626">CRITICAL RISK: SPLIT-BRAIN</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#334155">If old leader revives and still thinks it is master, both nodes accept writes.</text>
      <text x="12" y="48" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">Protection: Fencing tokens + Node STONITH isolation</text>
    </g>

    <!-- Right Box: RPO / RTO -->
    <g transform="translate(450, 14)">
      <rect width="410" height="62" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8">METRICS: RTO &amp; RPO</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#334155">RTO (Recovery Time): Time taken to detect crash + elect new leader (10s-30s).</text>
      <text x="12" y="48" font-family="ui-monospace, monospace" font-size="9" fill="#d97706">RPO (Recovery Point): Data loss window governed by replication lag</text>
    </g>
  </g>
</svg>