<svg width="100%" viewBox="0 0 960 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Replication Lag and Read-After-Write Consistency</title>
  <desc>System design diagram showing the replication lag race condition and the read-your-own-writes architectural mitigation.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="80" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">CONSISTENCY HAZARDS</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Replication Lag &amp; Read-Your-Own-Writes</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Race condition where immediate reads land on a lagging replica, and architectural mitigations</text>
  </g>

  <!-- ==================== THE PROBLEM: LAGGING REPLICA (LEFT) ==================== -->
  <g transform="translate(40, 92)">
    <rect width="560" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <rect x="14" y="14" width="532" height="26" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
    <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">The Inconsistency Problem: Read Stale Data</text>
    <text x="536" y="31" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#dc2626" text-anchor="end">Lag: ~200ms</text>

    <!-- User Node -->
    <g transform="translate(20, 60)">
      <rect width="90" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User</text>
      
      <rect x="10" y="36" width="70" height="40" rx="4" fill="#eff6ff"/>
      <text x="45" y="52" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#1d4ed8" text-anchor="middle">T=0ms</text>
      <text x="45" y="66" font-family="ui-monospace, monospace" font-size="8" fill="#1e40af" text-anchor="middle">Updates name</text>

      <rect x="10" y="90" width="70" height="48" rx="4" fill="#fef2f2"/>
      <text x="45" y="104" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">T=50ms</text>
      <text x="45" y="118" font-family="ui-monospace, monospace" font-size="8" fill="#991b1b" text-anchor="middle">Refreshes</text>
      <text x="45" y="130" font-family="ui-monospace, monospace" font-size="7.5" fill="#dc2626" text-anchor="middle">Sees old name!</text>
    </g>

    <!-- Path 1: Write to Leader -->
    <path d="M 110 90 L 220 90" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="165" y="82" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#2563eb" text-anchor="middle">1. UPDATE name="Bob"</text>

    <!-- Leader Node -->
    <g transform="translate(225, 66)">
      <path d="M 0 10 C 0 5, 120 5, 120 10 L 120 52 C 120 57, 0 57, 0 52 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <ellipse cx="60" cy="10" rx="60" ry="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Leader DB</text>
      <text x="60" y="46" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">name = "Bob"</text>
    </g>

    <!-- In-flight Async Replication Stream -->
    <path d="M 285 125 L 285 160" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>
    <rect x="300" y="132" width="115" height="18" rx="3" fill="#fffbeb" stroke="#fde68a"/>
    <text x="357" y="144" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle">In transit (Lag 200ms)</text>

    <!-- Follower Node (Lagging) -->
    <g transform="translate(225, 168)">
      <path d="M 0 10 C 0 5, 120 5, 120 10 L 120 52 C 120 57, 0 57, 0 52 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <ellipse cx="60" cy="10" rx="60" ry="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
      <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Follower DB</text>
      <text x="60" y="46" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">STALE: name = "Alice"</text>
    </g>

    <!-- Path 2: Read lands on Follower -->
    <path d="M 110 180 L 220 180" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
    <text x="165" y="172" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">2. GET profile</text>

    <!-- Path 3: Returns Stale Data -->
    <path d="M 220 200 L 110 200" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red)"/>
    <text x="165" y="214" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Returns "Alice"</text>

    <!-- Explanation Note Right of Diagram -->
    <g transform="translate(425, 68)">
      <rect width="120" height="150" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0f172a">USER EXPERIENCE:</text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">User submits "Bob",</text>
      <text x="10" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">sees "Bob saved",</text>
      <text x="10" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">refreshes page,</text>
      <text x="10" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#dc2626">sees "Alice" again!</text>
      <text x="10" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#64748b">Causes customer support tickets and panic.</text>
    </g>
  </g>

  <!-- ==================== THE SOLUTIONS (RIGHT) ==================== -->
  <g transform="translate(620, 92)">
    <rect width="300" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <rect x="14" y="14" width="272" height="26" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#15803d">System Design Solutions</text>

    <!-- Solution 1: Read-Your-Own-Writes -->
    <g transform="translate(14, 52)">
      <rect width="272" height="92" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d">1. READ-YOUR-OWN-WRITES</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0f172a">Sticky Time Window Routing</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">For 5-10 seconds after user writes,</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">route THAT user's reads to Leader.</text>
      <text x="12" y="80" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">All other users read from followers.</text>
    </g>

    <!-- Solution 2: Monotonic Reads -->
    <g transform="translate(14, 154)">
      <rect width="272" height="92" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#2563eb">2. MONOTONIC READS</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#0f172a">Replica Affinity / Sticky Session</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">Route user hash to the same replica,</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#475569">preventing time-travel reads between</text>
      <text x="12" y="80" font-family="ui-monospace, monospace" font-size="8.5" fill="#2563eb">fast replica and slow replica.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY BANNER ==================== -->
  <g transform="translate(40, 368)">
    <rect width="880" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="14" y="12" width="200" height="20" rx="3" fill="#fef3c7"/>
    <text x="114" y="25" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">INTERVIEW ARCHITECTURE RULE</text>
    <text x="225" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Profile &amp; Settings Pages vs Public Feeds</text>

    <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Always state in interviews: Read-Your-Own-Writes consistency is mandatory for user profile, cart, and account settings.</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Eventual consistency is acceptable for public social feeds, comments, follower counts, and recommendation streams.</text>
  </g>
</svg>