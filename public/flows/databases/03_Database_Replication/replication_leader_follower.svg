<svg width="100%" viewBox="0 0 960 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Leader-Follower Database Replication</title>
  <desc>System design diagram showing single-leader write path, replication log stream, and distributed read replicas.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="85" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">DATABASE REPLICATION</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Leader-Follower (Primary-Replica) Architecture</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Single leader accepts all writes; changes stream to read replicas for horizontal read scale-out</text>
  </g>

  <!-- Write Path Section (Top-Left) -->
  <g transform="translate(40, 95)">
    <!-- Write Client -->
    <rect width="130" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Write Client</text>
    <text x="65" y="38" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563eb" text-anchor="middle">INSERT / UPDATE</text>

    <!-- Arrow to Leader -->
    <path d="M 130 26 L 210 26" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="170" y="18" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#2563eb" text-anchor="middle">Writes</text>

    <!-- Leader Database Node -->
    <g transform="translate(215, -10)">
      <!-- Cylinder Top -->
      <path d="M 0 16 C 0 8, 160 8, 160 16 L 160 76 C 160 84, 0 84, 0 76 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <ellipse cx="80" cy="16" rx="80" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
      <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Leader (Primary)</text>
      <text x="80" y="60" font-family="ui-monospace, monospace" font-size="9.5" fill="#1d4ed8" text-anchor="middle">Read + Write Authority</text>
    </g>

    <!-- WAL Log Stream Pill -->
    <g transform="translate(400, 10)">
      <rect width="130" height="34" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
      <text x="65" y="15" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Replication Log</text>
      <text x="65" y="27" font-family="ui-monospace, monospace" font-size="8.5" fill="#78350f" text-anchor="middle">Binlog / WAL Stream</text>
    </g>

    <!-- Replication stream arrows from Leader to WAL -->
    <path d="M 375 26 L 396 26" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  </g>

  <!-- Fan-out Arrows from WAL to Followers -->
  <path d="M 530 122 C 570 122, 570 90, 610 90" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>
  <path d="M 530 122 C 570 122, 570 180, 610 180" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>
  <path d="M 530 122 C 570 122, 570 270, 610 270" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>
  <text x="560" y="112" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#2563eb">Replicate</text>

  <!-- Follower Replicas (Right Side Stack) -->
  <!-- Follower 1 -->
  <g transform="translate(615, 60)">
    <path d="M 0 12 C 0 6, 140 6, 140 12 L 140 52 C 140 58, 0 58, 0 52 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="70" cy="12" rx="70" ry="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Follower 1</text>
    <text x="70" y="47" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534" text-anchor="middle">Read-Only Replica</text>
  </g>

  <!-- Follower 2 -->
  <g transform="translate(615, 150)">
    <path d="M 0 12 C 0 6, 140 6, 140 12 L 140 52 C 140 58, 0 58, 0 52 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="70" cy="12" rx="70" ry="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Follower 2</text>
    <text x="70" y="47" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534" text-anchor="middle">Read-Only Replica</text>
  </g>

  <!-- Follower 3 -->
  <g transform="translate(615, 240)">
    <path d="M 0 12 C 0 6, 140 6, 140 12 L 140 52 C 140 58, 0 58, 0 52 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <ellipse cx="70" cy="12" rx="70" ry="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Follower 3</text>
    <text x="70" y="47" font-family="ui-monospace, monospace" font-size="8.5" fill="#166534" text-anchor="middle">Read-Only Replica</text>
  </g>

  <!-- Read Path Section (Bottom-Left to Followers) -->
  <g transform="translate(40, 225)">
    <rect width="130" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Read Clients</text>
    <text x="65" y="38" font-family="ui-monospace, monospace" font-size="9.5" fill="#059669" text-anchor="middle">SELECT Queries</text>
  </g>

  <!-- Read Load Balancer -->
  <g transform="translate(230, 225)">
    <rect width="130" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Read Router</text>
    <text x="65" y="38" font-family="ui-monospace, monospace" font-size="9" fill="#166534" text-anchor="middle">Round-Robin / LB</text>
  </g>

  <!-- Arrow: Read Client -> Read Router -->
  <path d="M 170 251 L 225 251" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Arrows: Read Router -> Followers -->
  <path d="M 360 240 C 440 240, 440 98, 610 98" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 360 251 C 440 251, 440 188, 610 188" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 360 262 C 440 262, 440 278, 610 278" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="440" y="220" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#059669">Reads</text>

  <!-- ==================== BOTTOM ARCHITECTURAL CARDS ==================== -->
  <g transform="translate(40, 360)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#eff6ff"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">WRITE PATH</text>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Single Master Authority</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Strict Write Serialization</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Prevents multi-node write conflicts</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(300, 0)">
      <rect width="280" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#f0fdf4"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">READ PATH</text>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Horizontal Read Scaling</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Load-Balanced Query Pool</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Add replicas as read traffic increases</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(600, 0)">
      <rect width="280" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#fffbeb"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">TRADE-OFF</text>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Replication Lag</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Asynchronous Delay</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Followers may serve slightly stale reads</text>
    </g>
  </g>
</svg>