<svg width="100%" viewBox="0 0 960 490" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Multi-Leader Active-Active Database Replication</title>
  <desc>Architecture of multi-datacenter active-active database leaders, bidirectional replication stream, and conflict resolution mechanisms.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="490" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="90" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">ACTIVE-ACTIVE TOPOLOGY</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Multi-Leader Cross-Region Replication</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Local low-latency writes across global datacenters with asynchronous inter-region sync</text>
  </g>

  <!-- ==================== REGION 1: US-EAST ==================== -->
  <g transform="translate(40, 92)">
    <rect width="360" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Region Badge -->
    <rect x="14" y="14" width="332" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="24" y="31" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">DATACENTER: US-EAST</text>
    <text x="336" y="31" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb" text-anchor="end">Low Latency (5ms)</text>

    <!-- US Client -->
    <g transform="translate(14, 55)">
      <rect width="90" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">US Clients</text>
      <text x="45" y="38" font-family="ui-monospace, monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">Local Writes</text>
    </g>

    <!-- Arrow to US Leader -->
    <path d="M 104 81 L 155 81" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

    <!-- US Leader Node -->
    <g transform="translate(160, 48)">
      <path d="M 0 10 C 0 5, 120 5, 120 10 L 120 56 C 120 61, 0 61, 0 56 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <ellipse cx="60" cy="10" rx="60" ry="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Leader US</text>
      <text x="60" y="48" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" text-anchor="middle">Write Authority</text>
    </g>

    <!-- Local US Follower -->
    <g transform="translate(160, 140)">
      <rect width="120" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">Followers US</text>
      <text x="60" y="32" font-family="ui-monospace, monospace" font-size="8" fill="#166534" text-anchor="middle">Read Scalability</text>
    </g>

    <!-- Local Replicate Arrow -->
    <path d="M 220 110 L 220 135" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
  </g>

  <!-- ==================== CROSS-REGION SYNC BRIDGE ==================== -->
  <g transform="translate(415, 130)">
    <rect width="130" height="150" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="65" y="20" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">CROSS-REGION</text>
    
    <!-- Bidirectional Arrows -->
    <!-- US -> EU -->
    <path d="M -10 35 L 140 35" stroke="#d97706" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-amber)"/>
    <text x="65" y="48" font-family="ui-monospace, monospace" font-size="8" fill="#92400e" text-anchor="middle">Async Sync -&gt;</text>

    <!-- EU -> US -->
    <path d="M 140 75 L -10 75" stroke="#d97706" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-amber)"/>
    <text x="65" y="88" font-family="ui-monospace, monospace" font-size="8" fill="#92400e" text-anchor="middle">&lt;- Async Sync</text>

    <!-- WAN Latency Note -->
    <rect x="8" y="105" width="114" height="34" rx="4" fill="#ffffff" stroke="#fde68a"/>
    <text x="65" y="120" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#92400e" text-anchor="middle">WAN Latency</text>
    <text x="65" y="132" font-family="ui-monospace, monospace" font-size="8" fill="#b45309" text-anchor="middle">~80ms to 120ms</text>
  </g>

  <!-- ==================== REGION 2: EU-WEST ==================== -->
  <g transform="translate(560, 92)">
    <rect width="360" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Region Badge -->
    <rect x="14" y="14" width="332" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="24" y="31" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">DATACENTER: EU-WEST</text>
    <text x="336" y="31" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb" text-anchor="end">Low Latency (5ms)</text>

    <!-- EU Leader Node -->
    <g transform="translate(80, 48)">
      <path d="M 0 10 C 0 5, 120 5, 120 10 L 120 56 C 120 61, 0 61, 0 56 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <ellipse cx="60" cy="10" rx="60" ry="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Leader EU</text>
      <text x="60" y="48" font-family="ui-monospace, monospace" font-size="8.5" fill="#1d4ed8" text-anchor="middle">Write Authority</text>
    </g>

    <!-- Arrow to EU Leader -->
    <path d="M 255 81 L 205 81" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

    <!-- EU Client -->
    <g transform="translate(255, 55)">
      <rect width="90" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="45" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">EU Clients</text>
      <text x="45" y="38" font-family="ui-monospace, monospace" font-size="8.5" fill="#2563eb" text-anchor="middle">Local Writes</text>
    </g>

    <!-- Local EU Follower -->
    <g transform="translate(80, 140)">
      <rect width="120" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">Followers EU</text>
      <text x="60" y="32" font-family="ui-monospace, monospace" font-size="8" fill="#166534" text-anchor="middle">Read Scalability</text>
    </g>

    <!-- Local Replicate Arrow -->
    <path d="M 140 110 L 140 135" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
  </g>

  <!-- ==================== CONFLICT RESOLUTION TILES ==================== -->
  <g transform="translate(40, 340)">
    <rect width="880" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0f172a">CONCURRENT WRITE CONFLICT RESOLUTION</text>

    <g transform="translate(16, 32)">
      <!-- Strategy 1 -->
      <g transform="translate(0, 0)">
        <rect width="268" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">1. LAST WRITE WINS (LWW)</text>
        <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#334155">Highest Timestamp Decides</text>
        <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Simple to implement.</text>
        <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#dc2626">Risk: NTP clock skew silently drops data.</text>
      </g>

      <!-- Strategy 2 -->
      <g transform="translate(290, 0)">
        <rect width="268" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d">2. CRDTS (CONVERGENT)</text>
        <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#334155">Conflict-Free Data Types</text>
        <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Mathematical union of sets &amp; counters.</text>
        <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#15803d">Guaranteed zero data loss convergence.</text>
      </g>

      <!-- Strategy 3 -->
      <g transform="translate(580, 0)">
        <rect width="268" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="12" y="18" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#d97706">3. CONFLICT HANDLERS</text>
        <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#334155">Custom Application Logic</text>
        <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">App code resolves version differences,</text>
        <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">or flags record for human review.</text>
      </g>
    </g>
  </g>
</svg>