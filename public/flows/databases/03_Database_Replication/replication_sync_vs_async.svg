<svg width="100%" viewBox="0 0 960 490" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Synchronous vs Asynchronous Replication</title>
  <desc>Comparison of synchronous replication blocking for follower ACK versus asynchronous background replication.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="490" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="85" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">REPLICATION MODES</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Synchronous vs Asynchronous Replication</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Write latency versus durability guarantees when committing transactions</text>
  </g>

  <!-- ==================== LEFT PANEL: SYNCHRONOUS ==================== -->
  <g transform="translate(40, 92)">
    <rect width="425" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Title Pill -->
    <rect x="14" y="14" width="397" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Synchronous Replication</text>
    <text x="390" y="32" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#2563eb" text-anchor="end">Blocks on Follower ACK</text>

    <!-- Client Box -->
    <g transform="translate(14, 60)">
      <rect width="80" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
      <text x="40" y="38" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">Write Req</text>
    </g>

    <!-- 1. Write Arrow: Client -> Leader -->
    <path d="M 94 85 L 140 85" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="117" y="77" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">1. Write</text>

    <!-- Leader Node -->
    <g transform="translate(145, 52)">
      <path d="M 0 10 C 0 5, 100 5, 100 10 L 100 60 C 100 65, 0 65, 0 60 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <ellipse cx="50" cy="10" rx="50" ry="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Leader</text>
      <text x="50" y="48" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8" text-anchor="middle">Commit Wait</text>
    </g>

    <!-- 2. Replicate Arrow: Leader -> Follower -->
    <path d="M 245 75 L 305 75" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="275" y="67" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">2. Replicate</text>

    <!-- 3. ACK Arrow: Follower -> Leader -->
    <path d="M 305 95 L 245 95" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="275" y="108" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">3. ACK</text>

    <!-- Follower Node -->
    <g transform="translate(310, 52)">
      <path d="M 0 10 C 0 5, 95 5, 95 10 L 95 60 C 95 65, 0 65, 0 60 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <ellipse cx="47" cy="10" rx="47" ry="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="47" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Follower</text>
      <text x="47" y="48" font-family="ui-monospace, monospace" font-size="8" fill="#166534" text-anchor="middle">Write to Disk</text>
    </g>

    <!-- 4. Final 200 OK Arrow: Leader -> Client -->
    <path d="M 145 100 L 94 100" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="117" y="113" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">4. 200 OK</text>

    <!-- Characteristics Box -->
    <g transform="translate(14, 140)">
      <rect width="397" height="114" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#15803d">DURABILITY:</text>
        <text x="90" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Zero Data Loss (RPO = 0). Replica has data.</text>

        <text x="0" y="24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b91c1c">LATENCY:</text>
        <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">High. Write is blocked by slowest replica network.</text>

        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b91c1c">AVAILABILITY:</text>
        <text x="90" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Low. If follower fails or hangs, writes are halted.</text>

        <text x="0" y="72" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8">BEST FOR:</text>
        <text x="90" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Financial ledgers, payments, zero data loss mandate.</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: ASYNCHRONOUS ==================== -->
  <g transform="translate(495, 92)">
    <rect width="425" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Title Pill -->
    <rect x="14" y="14" width="397" height="28" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#15803d">Asynchronous Replication</text>
    <text x="390" y="32" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#16a34a" text-anchor="end">Instant Client ACK</text>

    <!-- Client Box -->
    <g transform="translate(14, 60)">
      <rect width="80" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
      <text x="40" y="38" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b" text-anchor="middle">Write Req</text>
    </g>

    <!-- 1. Write Arrow: Client -> Leader -->
    <path d="M 94 75 L 140 75" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="117" y="67" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">1. Write</text>

    <!-- 2. Immediate ACK: Leader -> Client -->
    <path d="M 140 95 L 94 95" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text x="117" y="108" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">2. Fast ACK</text>

    <!-- Leader Node -->
    <g transform="translate(145, 52)">
      <path d="M 0 10 C 0 5, 100 5, 100 10 L 100 60 C 100 65, 0 65, 0 60 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <ellipse cx="50" cy="10" rx="50" ry="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Leader</text>
      <text x="50" y="48" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8" text-anchor="middle">Writes Locally</text>
    </g>

    <!-- 3. Background Replicate Arrow: Leader -> Follower -->
    <path d="M 245 85 L 305 85" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-amber)"/>
    <text x="275" y="77" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#d97706" text-anchor="middle">3. Async Log</text>

    <!-- Follower Node -->
    <g transform="translate(310, 52)">
      <path d="M 0 10 C 0 5, 95 5, 95 10 L 95 60 C 95 65, 0 65, 0 60 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <ellipse cx="47" cy="10" rx="47" ry="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="47" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Follower</text>
      <text x="47" y="48" font-family="ui-monospace, monospace" font-size="8" fill="#166534" text-anchor="middle">Replays Log</text>
    </g>

    <!-- Characteristics Box -->
    <g transform="translate(14, 140)">
      <rect width="397" height="114" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#15803d">LATENCY:</text>
        <text x="90" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Ultra-low (&lt; 1ms). Client does not wait for replicas.</text>

        <text x="0" y="24" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#15803d">AVAILABILITY:</text>
        <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">High. Follower slowdowns do not block write path.</text>

        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b91c1c">DURABILITY:</text>
        <text x="90" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Lag window risk. Un-replicated writes lost on crash.</text>

        <text x="0" y="72" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8">BEST FOR:</text>
        <text x="90" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Social feeds, telemetry, high-throughput web apps.</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM BEST PRACTICE BANNER ==================== -->
  <g transform="translate(40, 380)">
    <rect width="880" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="14" y="12" width="220" height="20" rx="3" fill="#eff6ff"/>
    <text x="124" y="25" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">INDUSTRY STANDARD PATTERN</text>
    <text x="245" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Semi-Synchronous Replication (MySQL / PostgreSQL)</text>

    <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Combines both worlds: Exactly 1 follower is designated as synchronous (guarantees zero data loss on leader death).</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">All remaining N-1 followers replicate asynchronously in parallel to preserve high write throughput.</text>
  </g>
</svg>