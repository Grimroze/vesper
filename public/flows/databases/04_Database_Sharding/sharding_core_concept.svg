<svg width="100%" viewBox="0 0 960 490" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Database Sharding Core Architecture</title>
  <desc>Horizontal partitioning of a monolithic database into independent physical shard nodes based on a shard key.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="490" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="80" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">SHARDING ARCHITECTURE</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Database Sharding: Horizontal Partitioning</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Splitting large datasets across multiple independent database machines with separate CPU, RAM, and disk</text>
  </g>

  <!-- ==================== TOP: MONOLITHIC LIMIT (BEFORE) ==================== -->
  <g transform="translate(40, 92)">
    <rect width="880" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Monolith Database Cylinder -->
    <g transform="translate(30, 16)">
      <path d="M 0 10 C 0 4, 150 4, 150 10 L 150 54 C 150 60, 0 60, 0 54 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <ellipse cx="75" cy="10" rx="75" ry="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
      <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Single Monolith DB</text>
      <text x="75" y="46" font-family="ui-monospace, monospace" font-size="8.5" fill="#dc2626" text-anchor="middle">100M Rows (Overloaded)</text>
    </g>

    <!-- Bottleneck Explanation -->
    <g transform="translate(220, 20)">
      <rect width="180" height="22" rx="4" fill="#fee2e2"/>
      <text x="90" y="15" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">HARDWARE CEILING</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0f172a">Single-Machine Bottlenecks:</text>
      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Disk storage exhaust, memory cache thrashing, lock contention.</text>
    </g>

    <!-- Horizontal Slicing Rule -->
    <g transform="translate(560, 20)">
      <rect width="290" height="55" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">SHARDING KEY PARTITIONING:</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Rows divided horizontally by <tspan font-family="ui-monospace, monospace" fill="#1e40af">user_id</tspan></text>
    </g>
  </g>

  <!-- Transition Arrows down to Shards -->
  <path d="M 230 188 L 180 220" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <path d="M 480 188 L 480 220" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <path d="M 730 188 L 780 220" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ==================== 3 DISTRIBUTED SHARDS ==================== -->
  <g transform="translate(40, 226)">
    
    <!-- Shard 1 -->
    <g transform="translate(0, 0)">
      <rect width="275" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Cylinder -->
      <g transform="translate(16, 16)">
        <path d="M 0 8 C 0 4, 100 4, 100 8 L 100 44 C 100 48, 0 48, 0 44 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
        <ellipse cx="50" cy="8" rx="50" ry="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
        <text x="50" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Shard 1</text>
        <text x="50" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8" text-anchor="middle">Node A</text>
      </g>

      <g transform="translate(130, 20)">
        <rect width="130" height="20" rx="3" fill="#eff6ff"/>
        <text x="65" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">KEYS: A to I</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">user_id: 1 .. 33M</text>
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Own CPU, RAM, Disk</text>
      </g>

      <rect x="12" y="80" width="251" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="97" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">Status: 33% Cluster Load</text>
    </g>

    <!-- Shard 2 -->
    <g transform="translate(302, 0)">
      <rect width="275" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Cylinder -->
      <g transform="translate(16, 16)">
        <path d="M 0 8 C 0 4, 100 4, 100 8 L 100 44 C 100 48, 0 48, 0 44 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
        <ellipse cx="50" cy="8" rx="50" ry="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
        <text x="50" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Shard 2</text>
        <text x="50" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8" text-anchor="middle">Node B</text>
      </g>

      <g transform="translate(130, 20)">
        <rect width="130" height="20" rx="3" fill="#eff6ff"/>
        <text x="65" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">KEYS: J to R</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">user_id: 34M .. 66M</text>
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Own CPU, RAM, Disk</text>
      </g>

      <rect x="12" y="80" width="251" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="97" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">Status: 33% Cluster Load</text>
    </g>

    <!-- Shard 3 -->
    <g transform="translate(605, 0)">
      <rect width="275" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

      <!-- Cylinder -->
      <g transform="translate(16, 16)">
        <path d="M 0 8 C 0 4, 100 4, 100 8 L 100 44 C 100 48, 0 48, 0 44 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
        <ellipse cx="50" cy="8" rx="50" ry="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
        <text x="50" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Shard 3</text>
        <text x="50" y="38" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8" text-anchor="middle">Node C</text>
      </g>

      <g transform="translate(130, 20)">
        <rect width="130" height="20" rx="3" fill="#eff6ff"/>
        <text x="65" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">KEYS: S to Z</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">user_id: 67M .. 100M</text>
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748b">Own CPU, RAM, Disk</text>
      </g>

      <rect x="12" y="80" width="251" height="26" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="97" font-family="ui-monospace, monospace" font-size="9" fill="#15803d">Status: 33% Cluster Load</text>
    </g>
  </g>

  <!-- ==================== BOTTOM TRADEOFF CARDS ==================== -->
  <g transform="translate(40, 365)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#f0fdf4"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">SCALABILITY</text>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Horizontal Scale</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Breaks Single-Node Ceiling</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Scale storage to petabytes with cheap servers</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(300, 0)">
      <rect width="280" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#eff6ff"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">RESILIENCE</text>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Fault Blast Radius</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Isolated Node Outages</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Shard 1 failure affects only 33% of users</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(600, 0)">
      <rect width="280" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#fffbeb"/>
      <text x="52" y="22" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">COMPLEXITY</text>
      <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Distributed Joins</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#334155">Cross-Shard Operations</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b">Multi-shard queries require scatter-gather</text>
    </g>
  </g>
</svg>