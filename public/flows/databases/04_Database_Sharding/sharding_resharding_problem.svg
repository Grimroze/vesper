<svg width="100%" viewBox="0 0 960 490" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The Resharding Problem and Consistent Hashing Solution</title>
  <desc>Comparison of naive modulus hashing causing 75% data reshuffle on node addition versus consistent hashing moving only K/N keys.</desc>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="490" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="80" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">RESHARDING DYNAMICS</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0f172a">The Resharding Problem: Modulus Hash vs Consistent Hashing</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Why naive modulo hash triggers massive data migration on node addition, and how ring hashing fixes it</text>
  </g>

  <!-- ==================== LEFT: THE NAIVE MODULO FLAW ==================== -->
  <g transform="translate(40, 92)">
    <rect width="425" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Header Pill -->
    <rect x="14" y="14" width="397" height="28" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#991b1b">The Problem: Naive Modulus (N -> N+1)</text>
    <text x="390" y="32" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#dc2626" text-anchor="end">75% Data Migration</text>

    <!-- Formula Comparison Box -->
    <g transform="translate(14, 55)">
      <rect width="397" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">BEFORE: 3 SHARDS (hash % 3)</text>
      <text x="12" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#0f172a">Key 10 % 3 = 1  |  Key 11 % 3 = 2  |  Key 12 % 3 = 0</text>

      <line x1="12" y1="46" x2="385" y2="46" stroke="#f1f5f9" stroke-width="1"/>

      <text x="12" y="62" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#dc2626">AFTER: ADD SHARD 4 (hash % 4)</text>
      <text x="12" y="76" font-family="ui-monospace, monospace" font-size="9" fill="#dc2626">Key 10 % 4 = 2 (MOVED!)  |  Key 11 % 4 = 3 (MOVED!)</text>
    </g>

    <!-- Impact Cards -->
    <g transform="translate(14, 150)">
      <rect width="397" height="98" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#dc2626">THE CASUALTY:</text>
        <text x="100" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Almost every key gets re-assigned to a new server.</text>

        <text x="0" y="24" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#dc2626">NETWORK STORM:</text>
        <text x="100" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Gigabytes of data copied concurrently across disks.</text>

        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#dc2626">DOWNTIME:</text>
        <text x="100" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">System requires read-only locks during resharding.</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT: THE CONSISTENT HASHING SOLUTION ==================== -->
  <g transform="translate(495, 92)">
    <rect width="425" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Header Pill -->
    <rect x="14" y="14" width="397" height="28" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#15803d">The Solution: Consistent Hashing Ring</text>
    <text x="390" y="32" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#16a34a" text-anchor="end">Only K/N Keys Move</text>

    <!-- Ring Model Box -->
    <g transform="translate(14, 55)">
      <rect width="397" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#15803d">VIRTUAL RING SPACE: [ 0 to 2^32 - 1 ]</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#0f172a">Nodes placed on circular continuum.</text>
      <text x="12" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#0f172a">Adding Shard 4 takes only keys between Shard 3 &amp; 4.</text>
      <text x="12" y="72" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#15803d">Untouched: 75% of keys stay on existing servers!</text>
    </g>

    <!-- Benefits Cards -->
    <g transform="translate(14, 150)">
      <rect width="397" height="98" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <g transform="translate(12, 16)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d">MINIMAL CHURN:</text>
        <text x="110" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Only K / (N + 1) keys remapped on node scale.</text>

        <text x="0" y="24" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d">ZERO DOWNTIME:</text>
        <text x="110" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Background streaming of affected partition only.</text>

        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#15803d">ADOPTION:</text>
        <text x="110" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">Cassandra, DynamoDB, Memcached, Akamai CDN.</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM ARCHITECTURAL SUMMARY ==================== -->
  <g transform="translate(40, 375)">
    <rect width="880" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="14" y="12" width="220" height="20" rx="3" fill="#eff6ff"/>
    <text x="124" y="25" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">SYSTEM DESIGN TAKEAWAY</text>
    <text x="245" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Never use Modulo Hashing for Dynamic Sharding</text>

    <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">In interviews, always emphasize: Naive modulus hashing works only if cluster size N never changes.</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#334155">For systems that scale elastically, Consistent Hashing with virtual nodes is the required architectural standard.</text>
  </g>
</svg>