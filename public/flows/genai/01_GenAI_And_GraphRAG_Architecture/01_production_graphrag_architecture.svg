<svg width="100%" viewBox="0 0 960 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Enterprise Production GraphRAG Architecture</title>
<desc>End-to-end production architecture showing offline knowledge graph construction and online hybrid multi-hop retrieval</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Page Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Enterprise GraphRAG Architecture</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Offline Knowledge Graph construction coupled with online hybrid vector and multi-hop graph retrieval</text>

<!-- ============================================== -->
<!-- PIPELINE 1: INGESTION & GRAPH CONSTRUCTION     -->
<!-- ============================================== -->
<rect x="25" y="75" width="910" height="210" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="100" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 1 : INGESTION &amp; KNOWLEDGE GRAPH CONSTRUCTION</text>

<!-- 1.1 Unstructured Sources -->
<rect x="45" y="120" width="135" height="75" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="112" y="145" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Raw Sources</text>
<text x="112" y="165" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">PDFs, Docs, Chats,</text>
<text x="112" y="180" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Database Tables</text>

<!-- Smooth Connector 1.1 -> 1.2 -->
<path d="M 180 157 C 198 157, 198 157, 215 157" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 1.2 Extraction LLM -->
<rect x="220" y="120" width="180" height="75" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="310" y="143" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">LLM Triplet Extraction</text>
<text x="310" y="163" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">structured output extracts:</text>
<text x="310" y="179" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:ui-monospace, monospace;font-size:11px;font-weight:500">(Subject, Predicate, Object)</text>

<!-- Smooth Connector 1.2 -> 1.3 -->
<path d="M 400 157 C 418 157, 418 157, 435 157" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 1.3 Entity Resolution & Deduplication -->
<rect x="440" y="120" width="180" height="75" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="530" y="143" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Entity Resolution</text>
<text x="530" y="163" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">disambiguates &amp; merges</text>
<text x="530" y="179" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">e.g., "HDFC" == "HDFC Bank"</text>

<!-- Smooth Connector 1.3 -> 1.4 -->
<path d="M 620 157 C 640 157, 640 157, 658 157" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 1.4 Dual Storage (Graph DB + Node Vector Index) -->
<rect x="663" y="108" width="250" height="98" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="788" y="128" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Hybrid Graph Storage</text>

<rect x="675" y="145" width="108" height="48" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="729" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Neo4j Property</text>
<text x="729" y="177" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">nodes &amp; edges</text>

<rect x="793" y="145" width="108" height="48" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="847" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Node Vector Index</text>
<text x="847" y="177" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">entity embeddings</text>

<text x="480" y="240" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Every node in Neo4j stores both its structural relationships and an embedding of its semantic description</text>

<!-- ============================================== -->
<!-- PIPELINE 2: RETRIEVAL & GENERATION FLOW        -->
<!-- ============================================== -->
<rect x="25" y="305" width="910" height="235" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="330" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 2 : HYBRID MULTI-HOP RETRIEVAL &amp; GENERATION</text>

<!-- 2.1 User Question -->
<rect x="45" y="355" width="145" height="85" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="117" y="375" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">User Query</text>
<text x="117" y="395" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">"Is Rahul linked to</text>
<text x="117" y="410" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">any court cases?"</text>
<text x="117" y="427" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Seeds: Rahul, Case</text>

<!-- Elegant Curved Branching into 2 Dual Retrieval Paths -->
<!-- Top branch to Vector -->
<path d="M 190 385 C 220 385, 215 365, 238 365" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<!-- Bottom branch to Graph Traversal -->
<path d="M 190 410 C 220 410, 215 435, 238 435" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 2.2A Vector Search Box -->
<rect x="245" y="345" width="220" height="42" rx="6" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="255" y="361" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">A. Vector Semantic Search</text>
<text x="255" y="376" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">finds entry nodes via cosine similarity</text>

<!-- 2.2B Graph Traversal Box -->
<rect x="245" y="415" width="220" height="48" rx="6" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="255" y="431" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">B. Multi-Hop Graph Traversal</text>
<text x="255" y="446" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">(Rahul)-[:CEO]-&gt;(Tech)-[:OWNS]-&gt;(Case)</text>

<!-- Elegant Curves Converging into Reranker -->
<path d="M 465 365 C 485 365, 485 385, 503 392" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 465 435 C 485 435, 485 410, 503 402" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 2.3 Reranker & Context Pruning -->
<rect x="510" y="355" width="165" height="85" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="592" y="375" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Reranker &amp; Filter</text>
<text x="592" y="395" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Cross-encoder prunes</text>
<text x="592" y="410" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">irrelevant graph hops</text>
<text x="592" y="427" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Reciprocal Rank Fusion</text>

<!-- Smooth Connector 2.3 -> 2.4 -->
<path d="M 675 397 C 695 397, 695 397, 715 397" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 2.4 Grounded Generation LLM -->
<rect x="720" y="345" width="195" height="105" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="817" y="368" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Grounded LLM Response</text>
<text x="817" y="390" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">"Indirect relationship found:</text>
<text x="817" y="406" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:500">Rahul's company acquired</text>
<text x="817" y="422" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:500">GreenEnergy (in lawsuit)."</text>
<text x="817" y="438" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">Hallucination-free citation</text>

<!-- Bottom Summary Note -->
<text x="480" y="500" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Vector search locates the specific entry points; Knowledge Graph traversal follows the relationships to solve multi-hop questions</text>

<!-- Global Footer -->
<text x="480" y="565" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Production GraphRAG System Design • Enterprise Pattern</text>
</svg>
