<svg width="100%" viewBox="0 0 960 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Agent Long-Term Memory Architecture (Mem0 Pattern)</title>
<desc>Multi-tiered agent memory architecture featuring working buffer, episodic vector memory, and semantic graph memory with automatic conflict resolution</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Agent Long-Term Memory Architecture (Mem0 Pattern)</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Decoupled async pipeline for extracting user facts, updating graph relationships, and resolving contradictions</text>

<!-- ============================================== -->
<!-- SECTION 1: WORKING MEMORY & ASYNC EXTRACTION   -->
<!-- ============================================== -->
<rect x="25" y="75" width="910" height="135" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="98" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 1 : CONVERSATION RUNTIME &amp; ASYNC EXTRACTION</text>

<!-- 1.1 User Input -->
<rect x="45" y="115" width="180" height="75" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="135" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">User Message</text>
<text x="135" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">"Doctor says I have pre-diabetes,</text>
<text x="135" y="171" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:500">strictly avoid all sugar!"</text>

<!-- Smooth Connector 1.1 -> 1.2 -->
<path d="M 225 152 C 248 152, 248 152, 268 152" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 1.2 Short-Term Buffer -->
<rect x="275" y="115" width="235" height="75" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="392" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Working Memory (RAM / Redis)</text>
<text x="392" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Sliding conversation window (last N turns)</text>
<text x="392" y="171" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:500">Provides immediate dialogue context</text>

<!-- Smooth Connector 1.2 -> 1.3 -->
<path d="M 510 152 C 532 152, 532 152, 552 152" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- 1.3 Async Extractor -->
<rect x="560" y="115" width="355" height="75" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="737" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Async Fact Extraction (Worker Queue)</text>
<text x="737" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Runs in background — zero impact on user response latency</text>
<text x="737" y="171" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Fact: (User) -[:DIAGNOSED_WITH]-&gt; (Pre-Diabetes)</text>

<!-- ============================================== -->
<!-- SECTION 2: CONFLICT RESOLUTION & HYBRID MEMORY -->
<!-- ============================================== -->
<rect x="25" y="230" width="910" height="175" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="253" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 2 : TEMPORAL CONFLICT RESOLUTION &amp; DUAL STORAGE</text>

<!-- Connecting Curve from Stage 1 to Stage 2 -->
<path d="M 737 190 C 737 215, 235 205, 235 270" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- 2.1 Conflict Engine -->
<rect x="45" y="270" width="380" height="115" rx="8" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.5"/>
<text x="235" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Temporal &amp; Conflict Resolution Engine</text>

<rect x="60" y="310" width="165" height="42" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(153, 60, 29);stroke-width:0.5"/>
<text x="142" y="324" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Past Preference (2 weeks ago):</text>
<text x="142" y="340" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">"Likes sweet vanilla coffee"</text>

<rect x="245" y="310" width="165" height="42" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="327" y="324" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">New Constraint (Today):</text>
<text x="327" y="340" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">"Avoid sugar (Pre-Diabetes)"</text>

<text x="235" y="370" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:500">Action: Deletes / archives sweet coffee edge; sets hard constraint edge</text>

<!-- Smooth Connector 2.1 -> Storage -->
<path d="M 425 328 C 455 328, 455 328, 480 328" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 2.2 Dual Storage: Episodic + Semantic -->
<rect x="490" y="270" width="425" height="115" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="702" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Long-Term Storage (Dual Layer)</text>

<!-- Episodic Vector DB -->
<rect x="505" y="310" width="190" height="60" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="600" y="326" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Episodic Vector DB</text>
<text x="600" y="342" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">pgvector / Qdrant</text>
<text x="600" y="356" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Semantic recall of past chats</text>

<!-- Semantic Graph DB -->
<rect x="710" y="310" width="190" height="60" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="805" y="326" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Semantic Graph DB</text>
<text x="805" y="342" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Neo4j Entity Graph</text>
<text x="805" y="356" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Explicit User &amp; Health nodes</text>

<!-- ============================================== -->
<!-- SECTION 3: RECALL & PROMPT INJECTION           -->
<!-- ============================================== -->
<rect x="25" y="425" width="910" height="110" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="448" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 3 : RUNTIME MEMORY RECALL &amp; AGENT ACTION</text>

<!-- Connecting Curve from DB to Stage 3 -->
<path d="M 702 385 C 702 405, 175 405, 175 460" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 3.1 Retrieval Trigger -->
<rect x="45" y="460" width="260" height="60" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="175" y="482" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Memory Search on New Turn</text>
<text x="175" y="502" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">User asks: "What should I order tonight?"</text>

<!-- Smooth Connector 3.1 -> 3.2 -->
<path d="M 305 490 C 330 490, 330 490, 350 490" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 3.2 Dynamic Prompt Injection -->
<rect x="355" y="460" width="310" height="60" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="510" y="480" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Dynamic System Prompt Injection</text>
<text x="510" y="496" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">[CONSTRAINT]: User has Pre-Diabetes.</text>
<text x="510" y="510" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Filter out all high glycemic foods &amp; sugar.</text>

<!-- Smooth Connector 3.2 -> 3.3 -->
<path d="M 665 490 C 690 490, 690 490, 710 490" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 3.3 Safe Output -->
<rect x="715" y="460" width="200" height="60" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="815" y="480" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Safe Personalized Output</text>
<text x="815" y="496" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">"Suggesting grilled salmon &amp; veggies;</text>
<text x="815" y="510" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:500">zero added sugars for pre-diabetes."</text>

<!-- Global Footer -->
<text x="480" y="565" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Mem0 &amp; Zep Agent Memory Pattern • Production Architecture</text>
</svg>
