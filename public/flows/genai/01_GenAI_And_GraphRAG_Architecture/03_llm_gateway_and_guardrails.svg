<svg width="100%" viewBox="0 0 960 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Enterprise LLM Gateway and Guardrails Architecture</title>
<desc>Production gateway architecture showing security filters, semantic caching, model routing, rate limiting, and output moderation</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Enterprise LLM Gateway &amp; Guardrails Architecture</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Unified proxy for semantic caching, multi-model fallback routing, PII masking, and streaming token control</text>

<!-- Client Layer (Left) -->
<rect x="25" y="100" width="130" height="290" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="90" y="125" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">CLIENT APPS</text>

<rect x="40" y="150" width="100" height="40" rx="6" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="90" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:500">Web App</text>

<rect x="40" y="210" width="100" height="40" rx="6" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="90" y="230" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:500">Mobile API</text>

<rect x="40" y="270" width="100" height="40" rx="6" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="90" y="290" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:500">Agent Services</text>

<text x="90" y="350" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">One API endpoint</text>
<text x="90" y="365" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">/v1/chat/completions</text>

<!-- Smooth Connector to Gateway -->
<path d="M 155 245 C 180 245, 180 245, 203 245" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- ============================================== -->
<!-- LLM GATEWAY PROXY CONTAINER                    -->
<!-- ============================================== -->
<rect x="210" y="85" width="460" height="395" rx="12" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:1"/>
<text x="235" y="112" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:14px;font-weight:600">Unified LLM Gateway (Portkey / LiteLLM / Kong Pattern)</text>

<!-- 1. Security & Input Guardrails -->
<rect x="230" y="135" width="420" height="60" rx="8" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.5"/>
<text x="245" y="155" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">1. Security Guardrails &amp; PII Anonymizer</text>
<text x="245" y="175" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Masks SSN/credit cards • Rebuffs prompt injections &amp; jailbreaks</text>

<!-- Smooth Curve to Cache -->
<path d="M 440 195 C 440 210, 440 210, 440 220" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 2. Semantic Cache -->
<rect x="230" y="225" width="420" height="65" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="245" y="245" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">2. Semantic Cache (Redis + Vector KNN)</text>
<text x="245" y="265" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Cosine Sim &gt; 0.95 → Returns cached response in 8ms (Zero LLM token cost)</text>

<!-- Smooth Curve to Router -->
<path d="M 440 290 C 440 305, 440 305, 440 315" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 3. Smart Model Router -->
<rect x="230" y="320" width="420" height="70" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="245" y="340" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">3. Smart Router &amp; Fallback Balancer</text>
<text x="245" y="360" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Routes based on latency, cost, &amp; rate limit</text>
<text x="245" y="375" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Primary: Claude / GPT-4 → Auto-fallback to Gemini / Llama</text>

<!-- 4. Token Bucket Limiter -->
<rect x="230" y="405" width="420" height="55" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="245" y="425" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">4. Per-Tenant Token Bucket Rate Limiting</text>
<text x="245" y="445" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Enforces TPM (Tokens/min) &amp; RPM limits; prevents bill shock</text>

<!-- Elegant Curves Out to Provider Pool -->
<path d="M 650 355 C 685 355, 680 180, 715 180" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 650 355 C 685 355, 680 260, 715 260" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 650 355 C 685 355, 680 340, 715 340" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 650 355 C 685 355, 680 420, 715 420" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- ============================================== -->
<!-- MODEL PROVIDER POOL (RIGHT)                    -->
<!-- ============================================== -->
<g transform="translate(720, 140)">
  <rect x="0" y="15" width="200" height="50" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(83, 74, 183);stroke-width:0.8"/>
  <text x="15" y="35" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Anthropic Claude</text>
  <text x="15" y="52" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">claude-3-5-sonnet</text>

  <rect x="0" y="95" width="200" height="50" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.8"/>
  <text x="15" y="115" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">OpenAI GPT</text>
  <text x="15" y="132" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">gpt-4o / o1</text>

  <rect x="0" y="175" width="200" height="50" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(24, 95, 165);stroke-width:0.8"/>
  <text x="15" y="195" dominant-baseline="central" style="fill:rgb(24, 95, 165);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Google Gemini</text>
  <text x="15" y="212" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">gemini-1.5-pro / flash</text>

  <rect x="0" y="255" width="200" height="50" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(133, 79, 11);stroke-width:0.8"/>
  <text x="15" y="275" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Self-Hosted vLLM</text>
  <text x="15" y="292" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Llama-3.3-70B</text>
</g>

<!-- Bottom Architecture Note -->
<text x="480" y="520" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Clients never hit raw model APIs directly — the Gateway provides resilience against outages, 429 rate limits, and latency spikes</text>

<!-- Global Footer -->
<text x="480" y="545" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Enterprise AI Infrastructure Pattern • Production Architecture</text>
</svg>
