<svg width="100%" viewBox="0 0 960 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Asynchronous Agentic Workflow and Streaming Queue</title>
<desc>High-level system design for running long-duration autonomous AI agents using message queues, isolated tool execution sandboxes, and real-time SSE streaming</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Asynchronous Long-Running AI Agent Architecture</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Decoupled queue-based architecture preventing HTTP timeouts while streaming real-time tool events via SSE</text>

<!-- ============================================== -->
<!-- TOP ROW: INGESTION, QUEUE & FAST RESPONSE      -->
<!-- ============================================== -->
<rect x="25" y="75" width="910" height="155" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="98" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 1 : CLIENT SUBMISSION &amp; ASYNC JOB DISPATCH</text>

<!-- 1.1 Web Client -->
<rect x="45" y="115" width="130" height="95" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="110" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">User / Client</text>
<text x="110" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">POST /v1/agent/run</text>
<text x="110" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">"Research competitor</text>
<text x="110" y="184" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">pricing across 5 sites"</text>

<!-- Connector 1.1 -> 1.2 -->
<path d="M 175 140 C 195 140, 195 140, 215 140" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="195" y="130" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:9px;font-weight:500">1. Submit</text>

<!-- Return 202 Accepted Arrow -->
<path d="M 215 175 C 195 175, 195 175, 175 175" fill="none" stroke="rgb(15, 110, 86)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="195" y="190" text-anchor="middle" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">202 Accepted</text>

<!-- 1.2 API Gateway -->
<rect x="220" y="115" width="180" height="95" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="310" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">FastAPI Gateway</text>
<text x="310" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">1. Generates task_id (UUID)</text>
<text x="310" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">2. Enqueues job in Redis</text>
<text x="310" y="185" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">Returns in 30ms!</text>

<!-- Connector 1.2 -> 1.3 -->
<path d="M 400 155 C 425 155, 425 155, 450 155" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="425" y="145" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:9px;font-weight:500">2. Enqueue</text>

<!-- 1.3 Task Queue (Redis / Celery / Temporal) -->
<rect x="455" y="115" width="200" height="95" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="555" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Task Queue &amp; State</text>
<text x="555" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Redis Streams / Celery / Temporal</text>
<text x="555" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">• Task state: PENDING</text>
<text x="555" y="185" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">• Persistent job checkpointing</text>

<!-- Connector 1.3 -> 1.4 Worker Pool -->
<path d="M 655 155 C 685 155, 685 155, 715 155" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="685" y="145" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:9px;font-weight:500">3. Dequeue</text>

<!-- 1.4 Worker Pods Indicator -->
<rect x="720" y="115" width="195" height="95" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="817" y="135" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Agent Worker Pool</text>
<text x="817" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Kubernetes Pods / Celery Workers</text>
<text x="817" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Pulls task; runs multi-step loop</text>
<text x="817" y="185" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Worker 3 claimed #8821</text>

<!-- ============================================== -->
<!-- BOTTOM ROW: AGENT EXECUTION LOOP & SSE STREAM  -->
<!-- ============================================== -->
<rect x="25" y="250" width="910" height="235" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="273" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">STAGE 2 : AUTONOMOUS AGENT LOOP &amp; REAL-TIME SSE STREAMING</text>

<!-- Connecting Curve from Worker down to Stage 2 -->
<path d="M 817 210 C 817 240, 817 240, 817 290" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 2.1 ReAct Loop Container (Right to Center) -->
<rect x="525" y="290" width="390" height="175" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="720" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">ReAct / Multi-Step Planner Loop</text>

<!-- Sub-Step A: LLM Reasoning -->
<rect x="545" y="330" width="165" height="50" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="627" y="347" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Reasoning Engine</text>
<text x="627" y="363" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Decides next tool to call</text>

<!-- Sub-Step B: Isolated Sandbox -->
<rect x="730" y="330" width="165" height="50" rx="6" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.5"/>
<text x="812" y="347" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Docker Sandbox</text>
<text x="812" y="363" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Runs scrapers / bash safe</text>

<!-- Curve inside loop -->
<path d="M 710 355 C 720 355, 720 355, 728 355" fill="none" stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- Sub-Step C: Checkpoint & State Save -->
<rect x="545" y="395" width="350" height="50" rx="6" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="720" y="412" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Database Checkpoint &amp; Event Emission</text>
<text x="720" y="428" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Postgres: saves step output • Redis Pub/Sub: emits step event</text>

<!-- Curve from Event Emission to SSE Gateway -->
<path d="M 545 420 C 470 420, 470 375, 410 375" fill="none" stroke="rgb(15, 110, 86)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="475" y="365" text-anchor="middle" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">Pub/Sub Event</text>

<!-- 2.2 SSE Streaming Hub (Left-Center) -->
<rect x="220" y="325" width="180" height="100" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="310" y="347" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">SSE Event Streamer</text>
<text x="310" y="367" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Maintains persistent HTTP</text>
<text x="310" y="382" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Server-Sent Events (SSE)</text>
<text x="310" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">GET /v1/agent/run/8821/stream</text>

<!-- Connector from SSE back to Client -->
<path d="M 220 375 C 195 375, 195 375, 175 375" fill="none" stroke="rgb(15, 110, 86)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="195" y="362" text-anchor="middle" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">Live SSE Feed</text>

<!-- 2.3 Client Live Terminal View (Left) -->
<rect x="45" y="325" width="130" height="100" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="110" y="347" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Client Live UI</text>
<text x="110" y="367" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">✓ Scraped site 1</text>
<text x="110" y="382" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">⟳ Querying site 2...</text>
<text x="110" y="402" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">Zero page refresh</text>

<!-- Bottom Summary Note -->
<text x="480" y="515" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Decouples compute from the HTTP request cycle: agents can run for 20 minutes without dropping the connection</text>

<!-- Global Footer -->
<text x="480" y="545" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Async Agent System Design • Production Architecture</text>
</svg>
