<svg width="100%" viewBox="0 0 960 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Hierarchical Memory Trees for Infinite Conversation</title>
<desc>Diagram showing tree-based hierarchical summarization that condenses thousands of turns into multi-level summaries with selective branch retrieval</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Hierarchical Summarization &amp; Memory Trees</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Scaling to 10,000+ turns: Multi-level abstraction with selective branch expansion during user recall</text>

<!-- ============================================== -->
<!-- HIERARCHICAL TREE VISUALIZATION                -->
<!-- ============================================== -->
<rect x="25" y="80" width="910" height="380" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>

<!-- Level 3: Root Profile Card (Top) -->
<rect x="330" y="100" width="300" height="50" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:1"/>
<text x="480" y="118" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">LEVEL 3 : ROOT USER &amp; PROJECT STATE (50 tokens)</text>
<text x="480" y="136" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">"User Aman • Building SaaS MVP • Strict $5k budget • US market"</text>

<!-- Connectors from Level 3 to Level 2 -->
<path d="M 410 150 C 410 175, 230 170, 230 190" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 480 150 C 480 170, 480 170, 480 190" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 550 150 C 550 175, 730 170, 730 190" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- Level 2: Topic / Chapter Summaries -->
<!-- Topic A -->
<rect x="100" y="190" width="260" height="52" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.8"/>
<text x="230" y="208" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Topic A: Auth &amp; Onboarding</text>
<text x="230" y="226" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Turns 1–100 summarized into 1 paragraph</text>

<!-- Topic B -->
<rect x="380" y="190" width="200" height="52" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.8"/>
<text x="480" y="208" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Topic B: Database Selection</text>
<text x="480" y="226" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">"Chose Postgres over Mongo"</text>

<!-- Topic C -->
<rect x="600" y="190" width="260" height="52" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.8"/>
<text x="730" y="208" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Topic C: Payment &amp; Deployment</text>
<text x="730" y="226" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Turns 201–500 summarized</text>

<!-- Connectors from Topic B to Sub-chunks -->
<path d="M 440 242 C 440 265, 380 260, 380 280" fill="none" stroke="rgb(133, 79, 11)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 520 242 C 520 265, 580 260, 580 280" fill="none" stroke="rgb(133, 79, 11)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- Level 1: Sub-Chunk Summaries (Mid Level) -->
<rect x="290" y="280" width="180" height="48" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(133, 79, 11);stroke-width:0.6"/>
<text x="380" y="296" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Sub-chunk 101–150</text>
<text x="380" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">Discussed ACID compliance needs</text>

<rect x="490" y="280" width="180" height="48" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(133, 79, 11);stroke-width:0.6"/>
<text x="580" y="296" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Sub-chunk 151–200</text>
<text x="580" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">Benchmarked write throughput</text>

<!-- Connectors from Sub-chunk to Leaf Raw Messages -->
<path d="M 380 328 C 380 348, 380 348, 380 365" fill="none" stroke="rgb(133, 79, 11)" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 580 328 C 580 348, 580 348, 580 365" fill="none" stroke="rgb(133, 79, 11)" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- Level 0: Leaf Nodes (Raw Messages in Long-Term Storage) -->
<rect x="230" y="365" width="500" height="75" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="480" y="385" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">LEVEL 0 : RAW CONVERSATION LEAVES (1,000+ turns in cold DB)</text>
<text x="480" y="405" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Only the queried branch (Topic B) is expanded into the prompt window</text>
<text x="480" y="422" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">95% of irrelevant conversation history remains compressed!</text>

<!-- ============================================== -->
<!-- BOTTOM EXPLANATION                             -->
<!-- ============================================== -->
<rect x="25" y="480" width="910" height="50" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="480" y="497" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">How Selective Expansion Works:</text>
<text x="480" y="513" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">When user asks "Why did we pick Postgres?", the agent queries the tree index, unrolls ONLY Topic B, and leaves Topics A &amp; C compressed.</text>

<!-- Global Footer -->
<text x="480" y="552" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Advanced Agent Memory Patterns • 04 Hierarchical Memory Trees</text>
</svg>
