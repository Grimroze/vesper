<svg width="100%" viewBox="0 0 960 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dynamic Graph Memory Update Lifecycle &amp; Decision Matrix</title>
<desc>Detailed state machine showing how modern agent memory engines like Mem0 and Graphiti extract triplets, evaluate existing graph state, and execute ADD, STRENGTHEN, or CONFLICT INVALIDATE operations</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Dynamic Graph Memory: Update &amp; Conflict Lifecycle</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">The 4-branch decision state machine executed by Mem0 and Graphiti whenever a user shares new information</text>

<!-- ============================================== -->
<!-- TOP ROW: EXTRACTION & GRAPH LOOKUP             -->
<!-- ============================================== -->
<rect x="25" y="80" width="910" height="135" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="102" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">PHASE 1 : TRIPLET EXTRACTION &amp; GRAPH MATCHING</text>

<!-- 1.1 New User Statement -->
<rect x="45" y="118" width="220" height="75" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="155" y="138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">1. User Statement</text>
<text x="155" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">"I sold my Tesla Model 3</text>
<text x="155" y="174" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:500">and bought an electric bike!"</text>

<!-- Connector 1.1 -> 1.2 -->
<path d="M 265 155 C 295 155, 295 155, 320 155" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 1.2 LLM Triplet Extractor -->
<rect x="325" y="118" width="255" height="75" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="452" y="138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">2. Triplet Extraction</text>
<text x="452" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">T1: (User) -[:SOLD]-&gt; (Tesla)</text>
<text x="452" y="174" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">T2: (User) -[:OWNS]-&gt; (Electric Bike)</text>

<!-- Connector 1.2 -> 1.3 -->
<path d="M 580 155 C 610 155, 610 155, 635 155" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- 1.3 Graph Query Match -->
<rect x="640" y="118" width="275" height="75" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="777" y="138" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">3. Match Existing Graph (Neo4j)</text>
<text x="777" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">MATCH (u:User)-[r:OWNS]-&gt;(v:Vehicle)</text>
<text x="777" y="174" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">FOUND EXISTING: (User)-[:OWNS]-&gt;(Tesla)</text>

<!-- Curve from Phase 1 to Decision Matrix -->
<path d="M 777 193 C 777 220, 480 205, 480 235" fill="none" stroke="rgb(107, 114, 128)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<!-- ============================================== -->
<!-- MIDDLE: 4-WAY DECISION MATRIX                  -->
<!-- ============================================== -->
<rect x="25" y="235" width="910" height="225" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="258" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600;letter-spacing:0.04em">PHASE 2 : MEMORY RECONCILIATION DECISION MATRIX</text>

<!-- Branch 1: ADD (New Fact) -->
<rect x="45" y="275" width="200" height="160" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.8"/>
<rect x="55" y="285" width="70" height="20" rx="4" style="fill:rgb(15, 110, 86)"/>
<text x="90" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:9px;font-weight:700">1. ADD</text>
<text x="55" y="322" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Brand New Knowledge</text>
<text x="55" y="342" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Fact has no existing overlap</text>
<text x="55" y="358" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Action: Creates new Node</text>
<text x="55" y="374" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">  and directed Edge</text>
<rect x="55" y="390" width="180" height="30" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="65" y="405" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:9px;font-weight:500">CREATE (b:Bike)-[:OWNS]...</text>

<!-- Branch 2: STRENGTHEN (Reinforcement) -->
<rect x="260" y="275" width="200" height="160" rx="8" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.8"/>
<rect x="270" y="285" width="105" height="20" rx="4" style="fill:rgb(83, 74, 183)"/>
<text x="322" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:9px;font-weight:700">2. STRENGTHEN</text>
<text x="270" y="322" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Confirmation / Re-affirm</text>
<text x="270" y="342" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• User re-mentions same fact</text>
<text x="270" y="358" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Action: Increments confidence</text>
<text x="270" y="374" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">  and updates last_active</text>
<rect x="270" y="390" width="180" height="30" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="280" y="405" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:ui-monospace, monospace;font-size:9px;font-weight:500">SET r.weight += 1, r.seen=NOW</text>

<!-- Branch 3: INVALIDATE / CONFLICT (Triggered by Current Example!) -->
<rect x="475" y="275" width="225" height="160" rx="8" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:1"/>
<rect x="485" y="285" width="105" height="20" rx="4" style="fill:rgb(153, 60, 29)"/>
<text x="537" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:9px;font-weight:700">3. INVALIDATE</text>
<text x="485" y="322" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Contradiction Detected!</text>
<text x="485" y="342" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• New fact replaces old fact</text>
<text x="485" y="358" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Action: Marks Tesla edge EXPIRED</text>
<text x="485" y="374" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Inserts Bike edge as ACTIVE</text>
<rect x="485" y="390" width="205" height="30" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(153, 60, 29);stroke-width:0.5"/>
<text x="495" y="405" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">SET r_old.status = 'EXPIRED'</text>

<!-- Branch 4: PRUNE (Garbage Collection) -->
<rect x="715" y="275" width="200" height="160" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.8"/>
<rect x="725" y="285" width="80" height="20" rx="4" style="fill:rgb(95, 94, 90)"/>
<text x="765" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:9px;font-weight:700">4. PRUNE</text>
<text x="725" y="322" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Memory Compaction</text>
<text x="725" y="342" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Nightly cron compaction job</text>
<text x="725" y="358" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Removes orphan nodes &amp; edges</text>
<text x="725" y="374" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">  with expired TTL &gt; 90 days</text>
<rect x="725" y="390" width="180" height="30" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="735" y="405" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:ui-monospace, monospace;font-size:9px;font-weight:500">DELETE r WHERE TTL &lt; NOW</text>

<!-- ============================================== -->
<!-- BOTTOM SUMMARY BAR                             -->
<!-- ============================================== -->
<rect x="25" y="480" width="910" height="48" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5"/>
<text x="480" y="497" text-anchor="middle" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Why Temporal Graph Updates are Crucial:</text>
<text x="480" y="513" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Human preferences change over time. Graph memory ensures an agent never recommends charging a Tesla after the user has sold it!</text>

<!-- Global Footer -->
<text x="480" y="550" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Production Graph Memory Engine • 06 Dynamic Update Lifecycle</text>
</svg>
