<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <text class="title" x="0" y="0">Automated CI/CD LLM Regression Evaluation Pipeline</text>
    <text class="subtitle" x="0" y="22">GitOps pipeline: PR trigger, parallel test execution, multi-metric quality gates, and automated PR diff blocking</text>
  </g>

  <!-- Top Pipeline Stages -->
  <g transform="translate(50, 85)">
    <!-- Stage 1: PR Trigger -->
    <g transform="translate(0, 0)">
      <rect width="180" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#e2e8f0"/>
      <text class="lbl" x="18" y="24" fill="#475569">STAGE 1</text>
      <text class="head" x="12" y="48">Git Pull Request</text>

      <rect x="12" y="60" width="156" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="lbl" x="20" y="78" fill="#0f172a">Prompt Change</text>
      <text class="code" x="20" y="92" fill="#64748b">prompts/v3.jinja</text>

      <rect x="12" y="110" width="156" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="lbl" x="20" y="128" fill="#0f172a">Model Update</text>
      <text class="code" x="20" y="142" fill="#64748b">gpt-4o-mini</text>

      <rect x="12" y="160" width="156" height="55" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="lbl" x="20" y="180" fill="#1d4ed8">CI Event Trigger</text>
      <text class="code" x="20" y="198" fill="#1d4ed8">on: pull_request</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 183 115 L 223 115" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Stage 2: DeepEval Runner -->
    <g transform="translate(228, 0)">
      <rect width="210" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#e2e8f0"/>
      <text class="lbl" x="18" y="24" fill="#475569">STAGE 2</text>
      <text class="head" x="12" y="48">DeepEval Runner</text>

      <rect x="12" y="60" width="186" height="48" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="lbl" x="20" y="78" fill="#0f172a">Golden Dataset</text>
      <text class="code" x="20" y="94" fill="#64748b">250 Test Cases</text>

      <rect x="12" y="116" width="186" height="100" rx="4" fill="#0f172a"/>
      <text class="code" x="18" y="138" fill="#94a3b8"># CLI Command</text>
      <text class="code" x="18" y="158" fill="#38bdf8">deepeval test run \</text>
      <text class="code" x="18" y="178" fill="#f8fafc">  test_evals.py \</text>
      <text class="code" x="18" y="198" fill="#facc15">  --parallel 8</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 441 115 L 481 115" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Stage 3: Quality Gates -->
    <g transform="translate(486, 0)">
      <rect width="320" height="230" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#dbeafe"/>
      <text class="lbl" x="18" y="24" fill="#1d4ed8">STAGE 3</text>
      <text class="head" x="12" y="48" fill="#1e3a8a">Quality Gate Assertions</text>

      <!-- Gate 1 -->
      <g transform="translate(12, 58)">
        <rect width="296" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="td" x="12" y="22" font-weight="600">Faithfulness &gt;= 0.85</text>
        <rect x="220" y="8" width="65" height="20" rx="4" fill="#ecfdf5"/>
        <text class="lbl" x="232" y="21" fill="#047857">0.91 PASS</text>
      </g>

      <!-- Gate 2 -->
      <g transform="translate(12, 100)">
        <rect width="296" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="td" x="12" y="22" font-weight="600">Hallucination &lt;= 0.05</text>
        <rect x="220" y="8" width="65" height="20" rx="4" fill="#ecfdf5"/>
        <text class="lbl" x="232" y="21" fill="#047857">0.02 PASS</text>
      </g>

      <!-- Gate 3 -->
      <g transform="translate(12, 142)">
        <rect width="296" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="td" x="12" y="22" font-weight="600">G-Eval Coherence &gt;= 0.80</text>
        <rect x="220" y="8" width="65" height="20" rx="4" fill="#fee2e2"/>
        <text class="lbl" x="232" y="21" fill="#b91c1c">0.74 FAIL</text>
      </g>

      <!-- Gate 4 -->
      <g transform="translate(12, 184)">
        <rect width="296" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="td" x="12" y="22" font-weight="600">P95 Latency &lt; 2.0s</text>
        <rect x="220" y="8" width="65" height="20" rx="4" fill="#ecfdf5"/>
        <text class="lbl" x="232" y="21" fill="#047857">1.1s PASS</text>
      </g>
    </g>

    <!-- Arrow 3 -> Fork -->
    <path d="M 808 115 L 848 115" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Fork Decision Diamond -->
    <g transform="translate(852, 70)">
      <polygon points="45,0 90,45 45,90 0,45" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <text class="lbl" x="28" y="42" fill="#0f172a">ALL</text>
      <text class="lbl" x="22" y="54" fill="#0f172a">PASS?</text>
    </g>

    <!-- Branch: PASS (Up) -->
    <path d="M 945 92 L 995 92 L 995 45 L 1030 45" stroke="#10b981" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
    <g transform="translate(1035, 10)">
      <rect width="165" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="10" y="10" width="75" height="18" rx="4" fill="#dcfce7"/>
      <text class="lbl" x="16" y="22" fill="#15803d">PASS GATE</text>
      <text class="head" x="10" y="46" fill="#166534">Merge Allowed</text>
      <text class="code" x="10" y="66" fill="#15803d">PR Check = Green</text>
      <text class="code" x="10" y="80" fill="#15803d">Model Tagged</text>
    </g>

    <!-- Branch: FAIL (Down) -->
    <path d="M 945 138 L 995 138 L 995 185 L 1030 185" stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
    <g transform="translate(1035, 130)">
      <rect width="165" height="90" rx="6" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.2"/>
      <rect x="10" y="10" width="75" height="18" rx="4" fill="#fee2e2"/>
      <text class="lbl" x="16" y="22" fill="#991b1b">FAIL GATE</text>
      <text class="head" x="10" y="46" fill="#991b1b">PR Blocked</text>
      <text class="code" x="10" y="66" fill="#b91c1c">Regression Detected</text>
      <text class="code" x="10" y="80" fill="#b91c1c">Bot Posts Diff</text>
    </g>
  </g>

  <!-- Bottom: GitHub PR Bot Diff Comment (Clean, no text flood) -->
  <g transform="translate(50, 340)">
    <rect width="1200" height="370" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.2"/>
    <text class="head" x="24" y="28">Automated Pull Request Regression Comment</text>

    <!-- Mock Comment Card -->
    <g transform="translate(24, 46)">
      <rect width="1152" height="295" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Table Header -->
      <g transform="translate(16, 16)">
        <rect width="1120" height="28" fill="#f1f5f9"/>
        <text class="th" x="16" y="18">METRIC</text>
        <text class="th" x="220" y="18">ASSERTION</text>
        <text class="th" x="380" y="18">BASELINE (MAIN)</text>
        <text class="th" x="550" y="18">THIS PR</text>
        <text class="th" x="700" y="18">DELTA</text>
        <text class="th" x="850" y="18">STATUS</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(16, 50)">
        <text class="td" x="16" y="20">Faithfulness</text>
        <text class="code" x="220" y="20">&gt;= 0.85</text>
        <text class="code" x="380" y="20">0.89</text>
        <text class="code" x="550" y="20">0.91</text>
        <text class="code" x="700" y="20" fill="#16a34a">+0.02</text>
        <rect x="850" y="6" width="60" height="20" rx="4" fill="#dcfce7"/>
        <text class="lbl" x="864" y="19" fill="#15803d">PASS</text>
      </g>
      <line x1="16" y1="80" x2="1136" y2="80" stroke="#f1f5f9"/>

      <!-- Row 2 -->
      <g transform="translate(16, 88)">
        <text class="td" x="16" y="20">Hallucination Rate</text>
        <text class="code" x="220" y="20">&lt;= 0.05</text>
        <text class="code" x="380" y="20">0.03</text>
        <text class="code" x="550" y="20">0.02</text>
        <text class="code" x="700" y="20" fill="#16a34a">-0.01</text>
        <rect x="850" y="6" width="60" height="20" rx="4" fill="#dcfce7"/>
        <text class="lbl" x="864" y="19" fill="#15803d">PASS</text>
      </g>
      <line x1="16" y1="118" x2="1136" y2="118" stroke="#f1f5f9"/>

      <!-- Row 3: Failure -->
      <g transform="translate(16, 126)">
        <text class="td" x="16" y="20" font-weight="600" fill="#b91c1c">G-Eval Coherence</text>
        <text class="code" x="220" y="20">&gt;= 0.80</text>
        <text class="code" x="380" y="20">0.82</text>
        <text class="code" x="550" y="20" fill="#b91c1c">0.74</text>
        <text class="code" x="700" y="20" fill="#b91c1c">-0.08</text>
        <rect x="850" y="6" width="60" height="20" rx="4" fill="#fee2e2"/>
        <text class="lbl" x="864" y="19" fill="#991b1b">FAIL</text>
      </g>
      <line x1="16" y1="156" x2="1136" y2="156" stroke="#f1f5f9"/>

      <!-- Compact Failure Detail Callout -->
      <g transform="translate(16, 170)">
        <rect width="1120" height="105" rx="6" fill="#fff5f5" stroke="#fecaca"/>
        <text class="head" x="16" y="24" fill="#991b1b">Regression Root Cause: Test Case #48 Failed</text>
        
        <text class="code" x="16" y="48" fill="#0f172a">Query: "Calculate multi-hop shipping discount for VIP customer"</text>
        <text class="code" x="16" y="68" fill="#b91c1c">Actual Output: "Total discount is 15%" (Omitted calculation steps)</text>
        <text class="code" x="16" y="88" fill="#64748b">CoT Rubric Penalty: Deducted points for missing intermediate bracket breakdown</text>
      </g>
    </g>
  </g>
</svg>
