<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; }
      .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <text class="title" x="0" y="0">Synthetic Golden Dataset Generation Pipeline (Evol-Instruct)</text>
    <text class="subtitle" x="0" y="22">DeepEval Synthesizer / Evol-Instruct: Autonomous mutation of simple seeds into hardened edge-case benchmarks</text>
  </g>

  <!-- Top: 5 Sequential Stages -->
  <g transform="translate(50, 85)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="215" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#e2e8f0"/>
      <text class="lbl" x="18" y="22" fill="#475569">STAGE 1</text>
      <text class="head" x="80" y="23">Context Ingestion</text>

      <rect x="12" y="38" width="191" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="lbl" x="18" y="55" fill="#0f172a">Knowledge Base</text>
      <text class="code" x="18" y="70" fill="#64748b">PDFs, Docs, Specs</text>

      <rect x="12" y="86" width="191" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text class="lbl" x="18" y="103" fill="#0f172a">Fact Chunking</text>
      <text class="code" x="18" y="118" fill="#64748b">Entity Extraction</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 218 70 L 253 70" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Stage 2 -->
    <g transform="translate(258, 0)">
      <rect width="215" height="140" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#dbeafe"/>
      <text class="lbl" x="18" y="22" fill="#1d4ed8">STAGE 2</text>
      <text class="head" x="80" y="23" fill="#1e3a8a">Seed Generation</text>

      <rect x="12" y="38" width="191" height="42" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text class="lbl" x="18" y="55" fill="#1e3a8a">Seed Questions</text>
      <text class="code" x="18" y="70" fill="#2563eb">Single-Fact Queries</text>

      <rect x="12" y="86" width="191" height="42" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text class="lbl" x="18" y="103" fill="#1e3a8a">Ground Truth</text>
      <text class="code" x="18" y="118" fill="#2563eb">Verbatim Snippet</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 476 70 L 511 70" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Stage 3 -->
    <g transform="translate(516, 0)">
      <rect width="230" height="140" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#ede9fe"/>
      <text class="lbl" x="18" y="22" fill="#6d28d9">STAGE 3</text>
      <text class="head" x="80" y="23" fill="#4c1d95">Evol-Instruct</text>

      <rect x="12" y="38" width="206" height="90" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
      <text class="lbl" x="18" y="58" fill="#6d28d9">4 Mutation Engines:</text>
      <text class="code" x="18" y="76" fill="#4c1d95">- Multi-Hop Reasoning</text>
      <text class="code" x="18" y="92" fill="#4c1d95">- Persona Variations</text>
      <text class="code" x="18" y="108" fill="#4c1d95">- Adversarial / Schema</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 749 70 L 784 70" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Stage 4 -->
    <g transform="translate(789, 0)">
      <rect width="210" height="140" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#fef3c7"/>
      <text class="lbl" x="18" y="22" fill="#b45309">STAGE 4</text>
      <text class="head" x="80" y="23" fill="#92400e">Critic Filter</text>

      <rect x="12" y="38" width="186" height="42" rx="4" fill="#ffffff" stroke="#fde68a"/>
      <text class="lbl" x="18" y="55" fill="#92400e">Answerability</text>
      <text class="code" x="18" y="70" fill="#b45309">Context Grounded?</text>

      <rect x="12" y="86" width="186" height="42" rx="4" fill="#ffffff" stroke="#fde68a"/>
      <text class="lbl" x="18" y="103" fill="#92400e">Quality Check</text>
      <text class="code" x="18" y="118" fill="#b45309">Natural Phrasing?</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 1002 70 L 1037 70" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Stage 5 -->
    <g transform="translate(1042, 0)">
      <rect width="158" height="140" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#d1fae5"/>
      <text class="lbl" x="18" y="22" fill="#047857">STAGE 5</text>
      <text class="head" x="80" y="23" fill="#064e3b">Gold Test</text>

      <rect x="12" y="38" width="134" height="90" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
      <text class="head" x="16" y="60" fill="#047857">500+ QAs</text>
      <text class="code" x="16" y="80" fill="#047857">JSONL Export</text>
      <text class="code" x="16" y="100" fill="#047857">CI/CD Ready</text>
    </g>
  </g>

  <!-- Middle: 4 Evolution Mutation Operators Grid -->
  <g transform="translate(50, 245)">
    <rect width="1200" height="260" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.2"/>
    <text class="head" x="24" y="26">Evol-Instruct Mutation Transformations</text>

    <!-- Operator 1 -->
    <g transform="translate(24, 42)">
      <rect width="275" height="200" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="90" height="18" rx="4" fill="#eff6ff"/>
      <text class="lbl" x="18" y="23" fill="#1d4ed8">1. MULTI-HOP</text>
      <text class="head" x="12" y="46">In-Depth Reasoning</text>

      <rect x="12" y="58" width="251" height="58" rx="4" fill="#f8fafc"/>
      <text class="code" x="18" y="76" fill="#64748b">Seed:</text>
      <text class="td" x="18" y="96">"What is the refund window?"</text>

      <rect x="12" y="124" width="251" height="66" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="code" x="18" y="142" fill="#1d4ed8">Evolved:</text>
      <text class="td" x="18" y="162">"Promo item bought Dec 15,</text>
      <text class="td" x="18" y="178">eligible on Jan 20?"</text>
    </g>

    <!-- Operator 2 -->
    <g transform="translate(315, 42)">
      <rect width="275" height="200" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="85" height="18" rx="4" fill="#f5f3ff"/>
      <text class="lbl" x="18" y="23" fill="#6d28d9">2. BREADTH</text>
      <text class="head" x="12" y="46">Persona &amp; Phrasing</text>

      <rect x="12" y="58" width="251" height="58" rx="4" fill="#f8fafc"/>
      <text class="code" x="18" y="76" fill="#64748b">Seed:</text>
      <text class="td" x="18" y="96">"How to setup SAML SSO?"</text>

      <rect x="12" y="124" width="251" height="66" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text class="code" x="18" y="142" fill="#6d28d9">Evolved:</text>
      <text class="td" x="18" y="162">"Okta admin requesting</text>
      <text class="td" x="18" y="178">XML federation endpoint"</text>
    </g>

    <!-- Operator 3 -->
    <g transform="translate(606, 42)">
      <rect width="275" height="200" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="105" height="18" rx="4" fill="#fee2e2"/>
      <text class="lbl" x="18" y="23" fill="#b91c1c">3. ADVERSARIAL</text>
      <text class="head" x="12" y="46">False Premise Trap</text>

      <rect x="12" y="58" width="251" height="58" rx="4" fill="#f8fafc"/>
      <text class="code" x="18" y="76" fill="#64748b">Seed:</text>
      <text class="td" x="18" y="96">"Is GraphQL supported?"</text>

      <rect x="12" y="124" width="251" height="66" rx="4" fill="#fff5f5" stroke="#fecaca"/>
      <text class="code" x="18" y="142" fill="#b91c1c">Evolved:</text>
      <text class="td" x="18" y="162">"Assuming /v2/gql active,</text>
      <text class="td" x="18" y="178">query token balances"</text>
    </g>

    <!-- Operator 4 -->
    <g transform="translate(897, 42)">
      <rect width="275" height="200" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="105" height="18" rx="4" fill="#fef3c7"/>
      <text class="lbl" x="18" y="23" fill="#b45309">4. CONSTRAINT</text>
      <text class="head" x="12" y="46">Schema &amp; Format</text>

      <rect x="12" y="58" width="251" height="58" rx="4" fill="#f8fafc"/>
      <text class="code" x="18" y="76" fill="#64748b">Seed:</text>
      <text class="td" x="18" y="96">"List the plan prices."</text>

      <rect x="12" y="124" width="251" height="66" rx="4" fill="#fffbeb" stroke="#fde68a"/>
      <text class="code" x="18" y="142" fill="#b45309">Evolved:</text>
      <text class="td" x="18" y="162">"Output JSON only:</text>
      <text class="td" x="18" y="178">{tier: str, price_cents: int}"</text>
    </g>
  </g>

  <!-- Bottom: DeepEval Synthesizer Code Block -->
  <g transform="translate(50, 520)">
    <rect width="1200" height="200" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text class="code" x="24" y="26" fill="#94a3b8"># Automated Dataset Generation</text>

    <g transform="translate(24, 46)">
      <text class="code" x="0" y="14" fill="#f43f5e">from</text>
      <text class="code" x="38" y="14" fill="#f8fafc"> deepeval.synthesizer </text>
      <text class="code" x="195" y="14" fill="#f43f5e">import</text>
      <text class="code" x="245" y="14" fill="#38bdf8"> Synthesizer, EvolutionType</text>

      <text class="code" x="0" y="40" fill="#38bdf8">synth</text>
      <text class="code" x="42" y="40" fill="#f8fafc"> = </text>
      <text class="code" x="55" y="40" fill="#facc15">Synthesizer</text>
      <text class="code" x="135" y="40" fill="#f8fafc">(model=</text>
      <text class="code" x="185" y="40" fill="#4ade80">"gpt-4o"</text>
      <text class="code" x="235" y="40" fill="#f8fafc">)</text>

      <text class="code" x="0" y="66" fill="#38bdf8">goldens</text>
      <text class="code" x="60" y="66" fill="#f8fafc"> = </text>
      <text class="code" x="75" y="66" fill="#38bdf8">synth.generate_goldens_from_docs</text>
      <text class="code" x="300" y="66" fill="#f8fafc">(</text>

      <text class="code" x="20" y="88" fill="#f8fafc">document_paths=[</text>
      <text class="code" x="135" y="88" fill="#4ade80">"specs.pdf"</text>
      <text class="code" x="200" y="88" fill="#f8fafc">],</text>

      <text class="code" x="20" y="110" fill="#f8fafc">evolutions=[</text>
      <text class="code" x="100" y="110" fill="#38bdf8">EvolutionType.MULTIHOP</text>
      <text class="code" x="245" y="110" fill="#f8fafc">, </text>
      <text class="code" x="255" y="110" fill="#38bdf8">EvolutionType.CONSTRAINED</text>
      <text class="code" x="415" y="110" fill="#f8fafc">]</text>
      <text class="code" x="0" y="130" fill="#f8fafc">)</text>
    </g>

    <!-- Side Callout -->
    <g transform="translate(680, 36)">
      <rect width="490" height="135" rx="6" fill="#1e293b"/>
      <text class="head" x="16" y="28" fill="#38bdf8">Advantages of Synthetic Benchmarks</text>
      <text class="code" x="16" y="54" fill="#cbd5e1">- 10x Faster than manual human annotation</text>
      <text class="code" x="16" y="74" fill="#cbd5e1">- Systematic edge-case and jailbreak coverage</text>
      <text class="code" x="16" y="94" fill="#cbd5e1">- Guaranteed ground-truth chunk traceability</text>
      <text class="code" x="16" y="114" fill="#cbd5e1">- Direct integration into CI/CD pytest suites</text>
    </g>
  </g>
</svg>
