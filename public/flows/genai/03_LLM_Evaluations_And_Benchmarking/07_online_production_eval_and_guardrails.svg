<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; }
      .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1e293b; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <text class="title" x="0" y="0">Online Production LLM Evaluation &amp; Real-Time Guardrails</text>
    <text class="subtitle" x="0" y="22">Dual-plane architecture: Low-latency synchronous guardrails coupled with asynchronous LLM-as-a-Judge telemetry</text>
  </g>

  <!-- TOP PLANE: Synchronous Serving Path -->
  <g transform="translate(50, 85)">
    <rect width="1200" height="230" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="20" y="12" width="200" height="20" rx="4" fill="#eff6ff"/>
    <text class="lbl" x="28" y="26" fill="#1d4ed8">SYNCHRONOUS INLINE PATH (&lt; 800ms)</text>

    <!-- Node 1: Client -->
    <g transform="translate(20, 45)">
      <rect width="160" height="160" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="10" y="10" width="55" height="18" rx="4" fill="#f1f5f9"/>
      <text class="lbl" x="16" y="22" fill="#475569">CLIENT</text>
      <text class="head" x="10" y="46">User Request</text>
      <text class="code" x="10" y="66" fill="#64748b">Prompt + Session ID</text>
      <text class="code" x="10" y="84" fill="#64748b">POST /v1/chat</text>
      <line x1="10" y1="100" x2="150" y2="100" stroke="#f1f5f9"/>
      <text class="code" x="10" y="120" fill="#0369a1">Latency: 0ms</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 183 125 L 218 125" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Node 2: Input Guardrail -->
    <g transform="translate(223, 45)">
      <rect width="215" height="160" rx="6" fill="#fff5f5" stroke="#fca5a5"/>
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#fee2e2"/>
      <text class="lbl" x="16" y="22" fill="#991b1b">INPUT GUARD</text>
      <text class="head" x="10" y="46">Safety &amp; Injection</text>
      <text class="code" x="10" y="66" fill="#b91c1c">- Prompt Injection Check</text>
      <text class="code" x="10" y="82" fill="#b91c1c">- PII Masking / Anonymize</text>
      <text class="code" x="10" y="98" fill="#b91c1c">- Jailbreak Refusal</text>
      <line x1="10" y1="110" x2="205" y2="110" stroke="#fed7d7"/>
      <rect x="10" y="120" width="105" height="22" rx="4" fill="#ffffff" stroke="#fca5a5"/>
      <text class="lbl" x="18" y="135" fill="#991b1b">Overhead: ~15ms</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 441 125 L 476 125" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Node 3: Primary LLM -->
    <g transform="translate(481, 45)">
      <rect width="240" height="160" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="10" y="10" width="85" height="18" rx="4" fill="#dbeafe"/>
      <text class="lbl" x="16" y="22" fill="#1d4ed8">CORE ENGINE</text>
      <text class="head" x="10" y="46">Primary LLM &amp; RAG</text>
      <text class="code" x="10" y="66" fill="#1e40af">- GPT-4o / Claude 3.5</text>
      <text class="code" x="10" y="82" fill="#1e40af">- Hybrid Index Retrieval</text>
      <text class="code" x="10" y="98" fill="#1e40af">- Tool Calling / Agents</text>
      <line x1="10" y1="110" x2="230" y2="110" stroke="#bfdbfe"/>
      <rect x="10" y="120" width="115" height="22" rx="4" fill="#ffffff" stroke="#93c5fd"/>
      <text class="lbl" x="18" y="135" fill="#1d4ed8">TTFT: ~350ms</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 724 125 L 759 125" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

    <!-- Node 4: Output Guardrail -->
    <g transform="translate(764, 45)">
      <rect width="215" height="160" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#fef3c7"/>
      <text class="lbl" x="16" y="22" fill="#b45309">OUTPUT GUARD</text>
      <text class="head" x="10" y="46">Schema &amp; Leakage</text>
      <text class="code" x="10" y="66" fill="#b45309">- JSON Schema Validation</text>
      <text class="code" x="10" y="82" fill="#b45309">- Sensitive Data Mask</text>
      <text class="code" x="10" y="98" fill="#b45309">- Safe Fallback Trigger</text>
      <line x1="10" y1="110" x2="205" y2="110" stroke="#fde68a"/>
      <rect x="10" y="120" width="105" height="22" rx="4" fill="#ffffff" stroke="#fde68a"/>
      <text class="lbl" x="18" y="135" fill="#b45309">Overhead: ~5ms</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 982 125 L 1017 125" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>

    <!-- Node 5: User Response -->
    <g transform="translate(1022, 45)">
      <rect width="158" height="160" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <rect x="10" y="10" width="75" height="18" rx="4" fill="#d1fae5"/>
      <text class="lbl" x="16" y="22" fill="#047857">DELIVERY</text>
      <text class="head" x="10" y="46">Safe Stream</text>
      <text class="code" x="10" y="66" fill="#047857">User UI Display</text>
      <rect x="10" y="90" width="138" height="50" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
      <text class="lbl" x="18" y="112" fill="#047857">User Feedback:</text>
      <text class="code" x="18" y="128" fill="#047857">[Thumbs Up / Down]</text>
    </g>
  </g>

  <!-- Tap Line downward -->
  <path d="M 601 315 L 601 360" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="510" y="325" width="180" height="22" rx="4" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="lbl" x="520" y="340" fill="#6d28d9">Async Telemetry Tap (100%)</text>

  <!-- BOTTOM PLANE: Asynchronous Evaluation Plane -->
  <g transform="translate(50, 370)">
    <rect width="1200" height="340" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="20" y="12" width="220" height="20" rx="4" fill="#f5f3ff"/>
    <text class="lbl" x="28" y="26" fill="#6d28d9">ASYNCHRONOUS EVALUATION PLANE</text>

    <!-- Component 1: Tracing Store -->
    <g transform="translate(20, 45)">
      <rect width="260" height="270" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="105" height="18" rx="4" fill="#f1f5f9"/>
      <text class="lbl" x="18" y="22" fill="#475569">TELEMETRY SINK</text>
      <text class="head" x="12" y="46">Langfuse / Phoenix</text>
      <text class="code" x="12" y="64" fill="#64748b">100% Traces Logged</text>

      <rect x="12" y="76" width="236" height="180" rx="4" fill="#0f172a"/>
      <text class="code" x="18" y="98" fill="#38bdf8">Payload {</text>
      <text class="code" x="24" y="118" fill="#f8fafc">  trace_id: "t_4892",</text>
      <text class="code" x="24" y="138" fill="#f8fafc">  prompt: "...",</text>
      <text class="code" x="24" y="158" fill="#f8fafc">  context_chunks: 5,</text>
      <text class="code" x="24" y="178" fill="#f8fafc">  latency: 382ms,</text>
      <text class="code" x="24" y="198" fill="#f8fafc">  feedback: "down"</text>
      <text class="code" x="18" y="220" fill="#38bdf8">}</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 283 180 L 318 180" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>

    <!-- Component 2: Sampling Router -->
    <g transform="translate(323, 45)">
      <rect width="270" height="270" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="115" height="18" rx="4" fill="#eff6ff"/>
      <text class="lbl" x="18" y="22" fill="#1d4ed8">SAMPLING ROUTER</text>
      <text class="head" x="12" y="46">Cost Control Logic</text>

      <rect x="12" y="64" width="246" height="54" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="lbl" x="18" y="82" fill="#1d4ed8">1. Anomaly Traffic (100%)</text>
      <text class="code" x="18" y="100" fill="#1e40af">Thumbs down OR Latency &gt; 3s</text>

      <rect x="12" y="128" width="246" height="54" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text class="lbl" x="18" y="146" fill="#475569">2. Baseline Drift (5%)</text>
      <text class="code" x="18" y="164" fill="#64748b">Uniform random sampling</text>

      <rect x="12" y="192" width="246" height="64" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text class="head" x="18" y="214" fill="#166534">Cost Saving: 93%</text>
      <text class="code" x="18" y="234" fill="#166534">Evaluates all critical issues</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 596 180 L 631 180" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>

    <!-- Component 3: DeepEval Worker Pool -->
    <g transform="translate(636, 45)">
      <rect width="300" height="270" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="135" height="18" rx="4" fill="#f5f3ff"/>
      <text class="lbl" x="18" y="22" fill="#6d28d9">DEEPEVAL WORKER POOL</text>
      <text class="head" x="12" y="46">Async Judge Queue</text>

      <rect x="12" y="64" width="276" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
      <text class="lbl" x="16" y="82" fill="#6d28d9">Faithfulness Metric</text>
      <text class="code" x="16" y="96" fill="#4c1d95">Grounding claims check</text>

      <rect x="12" y="116" width="276" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
      <text class="lbl" x="16" y="134" fill="#6d28d9">Answer Relevance</text>
      <text class="code" x="16" y="148" fill="#4c1d95">Semantic cosine alignment</text>

      <rect x="12" y="168" width="276" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
      <text class="lbl" x="16" y="186" fill="#6d28d9">Hallucination Metric</text>
      <text class="code" x="16" y="200" fill="#4c1d95">NLI Contradiction scoring</text>

      <rect x="12" y="220" width="276" height="36" rx="4" fill="#f1f5f9"/>
      <text class="code" x="16" y="242" fill="#475569">Judge: GPT-4o-mini / Haiku</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 939 180 L 974 180" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>

    <!-- Component 4: Triage & Alerts -->
    <g transform="translate(979, 45)">
      <rect width="201" height="270" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="105" height="18" rx="4" fill="#fee2e2"/>
      <text class="lbl" x="18" y="22" fill="#991b1b">ACTION TRIAGE</text>
      <text class="head" x="12" y="46">Alerts &amp; HITL</text>

      <rect x="12" y="64" width="177" height="85" rx="4" fill="#fff5f5" stroke="#fecaca"/>
      <text class="lbl" x="16" y="84" fill="#991b1b">Slack / PagerDuty</text>
      <text class="code" x="16" y="104" fill="#b91c1c">Moving Avg Faithful</text>
      <text class="code" x="16" y="122" fill="#b91c1c">drops &lt; 0.82</text>
      <text class="lbl" x="16" y="140" fill="#991b1b">[P1 Alert]</text>

      <rect x="12" y="160" width="177" height="95" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text class="lbl" x="16" y="180" fill="#1d4ed8">Human-in-the-Loop</text>
      <text class="code" x="16" y="200" fill="#1e40af">Score &lt; 0.60 routed</text>
      <text class="code" x="16" y="218" fill="#1e40af">to domain expert</text>
      <text class="lbl" x="16" y="238" fill="#1d4ed8">[Review Queue]</text>
    </g>
  </g>
</svg>
