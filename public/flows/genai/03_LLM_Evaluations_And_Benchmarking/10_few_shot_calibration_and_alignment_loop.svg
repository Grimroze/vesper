<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .node-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; fill: #64748b; }
      .center-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; fill: #1e3a8a; }
      .center-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; fill: #2563eb; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(60, 44)">
    <text class="title" x="0" y="0">Few-Shot Judge Calibration &amp; Active Alignment Cycle</text>
    <text class="subtitle" x="0" y="22">Continuous calibration loop: Sampling edge cases, curating gold anchors, and maximizing human correlation</text>
  </g>

  <!-- Circular Loop Canvas -->
  <g transform="translate(60, 95)">
    <rect width="1180" height="625" rx="24" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Center Hub (Large Circular Core) -->
    <g transform="translate(590, 310)">
      <circle cx="0" cy="0" r="100" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="0" cy="0" r="82" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text class="center-txt" x="0" y="-8">Judge Alignment</text>
      <text class="center-sub" x="0" y="12">Active Learning</text>
      <text class="code" x="0" y="32" text-anchor="middle" fill="#047857">rho &gt; 0.85</text>
    </g>

    <!-- 5 Orbital Circular Nodes -->

    <!-- Node 1: Top (12 o'clock) - Production Logs -->
    <g transform="translate(590, 85)">
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <text class="node-txt" x="0" y="-4" fill="#1e3a8a">Live Logs</text>
      <text class="node-sub" x="0" y="14" fill="#2563eb">Unlabeled Data</text>
    </g>

    <!-- Node 2: Top-Right (2:30 o'clock) - Uncertainty Sampling -->
    <g transform="translate(890, 185)">
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <text class="node-txt" x="0" y="-4" fill="#4c1d95">Sampling</text>
      <text class="node-sub" x="0" y="14" fill="#6d28d9">Uncertainty Cut</text>
    </g>

    <!-- Node 3: Bottom-Right (4:30 o'clock) - Human Expert Annotation -->
    <g transform="translate(890, 435)">
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text class="node-txt" x="0" y="-4" fill="#064e3b">Human Gold</text>
      <text class="node-sub" x="0" y="14" fill="#047857">Expert Rating</text>
    </g>

    <!-- Node 4: Bottom-Left (7:30 o'clock) - Exemplar Anchor Bank -->
    <g transform="translate(290, 435)">
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <text class="node-txt" x="0" y="-4" fill="#78350f">Anchor Bank</text>
      <text class="node-sub" x="0" y="14" fill="#b45309">Few-Shot Bank</text>
    </g>

    <!-- Node 5: Top-Left (9:30 o'clock) - Prompt Calibration -->
    <g transform="translate(290, 185)">
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <text class="node-txt" x="0" y="-4" fill="#1e3a8a">Prompt Tuning</text>
      <text class="node-sub" x="0" y="14" fill="#2563eb">Few-Shot Ingest</text>
    </g>

    <!-- Curved Flow Paths Between Nodes (Graceful Orbit) -->
    <!-- Node 1 -> Node 2 -->
    <path d="M 644 95 C 740 100, 810 130, 845 160" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Node 2 -> Node 3 -->
    <path d="M 890 240 C 910 290, 910 330, 890 380" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Node 3 -> Node 4 -->
    <path d="M 835 450 C 720 540, 460 540, 345 450" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-emerald)"/>

    <!-- Node 4 -> Node 5 -->
    <path d="M 290 380 C 270 330, 270 290, 290 240" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Node 5 -> Node 1 -->
    <path d="M 335 160 C 370 130, 440 100, 535 95" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Subtle Centripetal Connectors to Center Hub -->
    <path d="M 590 140 L 590 210" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 836 215 L 685 270" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 836 405 L 685 350" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 344 405 L 495 350" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 344 215 L 495 270" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Top Left Capsule Legend -->
    <g transform="translate(30, 24)">
      <rect width="180" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#3b82f6"/>
      <text class="lbl" x="30" y="18">Continuous Loop</text>
    </g>

    <!-- Top Right Capsule Legend -->
    <g transform="translate(980, 24)">
      <rect width="170" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#10b981"/>
      <text class="lbl" x="30" y="18">Spearman Metric</text>
    </g>

    <!-- Bottom Capsule Summary -->
    <g transform="translate(420, 575)">
      <rect width="340" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="code" x="170" y="21" text-anchor="middle" fill="#1e3a8a">Goal: Judge Output == Human Expert Grade</text>
    </g>
  </g>
</svg>
