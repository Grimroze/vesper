<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .node-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; fill: #64748b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(60, 44)">
    <text class="title" x="0" y="0">Multimodal Vision-Language Evaluation Flow</text>
    <text class="subtitle" x="0" y="22">Cross-modal validation: Spatial grounding, POPE object hallucination probing, and visual question answering</text>
  </g>

  <!-- Flow Canvas -->
  <g transform="translate(60, 95)">
    <rect width="1180" height="625" rx="24" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Input Node: Image + Text Query -->
    <g transform="translate(130, 310)">
      <circle cx="0" cy="0" r="66" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="0" r="54" fill="#f8fafc"/>
      <text class="node-txt" x="0" y="-6">VLM Input</text>
      <text class="node-sub" x="0" y="12">Image + Text</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#64748b">Multimodal</text>
    </g>

    <!-- Curved Arrow to VLM Inference -->
    <path d="M 198 310 C 270 310, 320 310, 380 310" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Center Model: VLM Target Model -->
    <g transform="translate(450, 310)">
      <circle cx="0" cy="0" r="68" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="56" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#1e3a8a">VLM Engine</text>
      <text class="node-sub" x="0" y="12" fill="#2563eb">GPT-4o / Claude</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#1d4ed8">Generation</text>
    </g>

    <!-- Curved Divergence to 3 Evaluation Probes -->
    <!-- Probe 1 (Top): Spatial Grounding & OCR -->
    <path d="M 515 280 C 600 200, 660 160, 750 160" fill="none" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#arr-purple)"/>
    <g transform="translate(820, 160)">
      <circle cx="0" cy="0" r="64" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text class="node-txt" x="0" y="-6" fill="#4c1d95">Grounding</text>
      <text class="node-sub" x="0" y="12" fill="#6d28d9">IoU Bounding Box</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#6d28d9">OCR Precision</text>
    </g>

    <!-- Probe 2 (Middle): POPE Object Hallucination -->
    <path d="M 520 310 C 610 310, 670 310, 750 310" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <g transform="translate(820, 310)">
      <circle cx="0" cy="0" r="64" fill="#fff5f5" stroke="#fca5a5" stroke-width="2"/>
      <text class="node-txt" x="0" y="-6" fill="#991b1b">POPE Probe</text>
      <text class="node-sub" x="0" y="12" fill="#dc2626">Hallucination</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#b91c1c">Object Exists?</text>
    </g>

    <!-- Probe 3 (Bottom): VQA / Semantic Alignment -->
    <path d="M 515 340 C 600 420, 660 460, 750 460" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arr-green)"/>
    <g transform="translate(820, 460)">
      <circle cx="0" cy="0" r="64" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text class="node-txt" x="0" y="-6" fill="#064e3b">VQA Metric</text>
      <text class="node-sub" x="0" y="12" fill="#047857">Semantic Match</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#047857">Answer Valid</text>
    </g>

    <!-- Curved Reconvergence to Aggregate Score Node -->
    <path d="M 886 160 C 960 160, 1010 240, 1055 280" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
    <path d="M 886 310 C 950 310, 990 310, 1030 310" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <path d="M 886 460 C 960 460, 1010 380, 1055 340" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Terminal Circular Node: Final Multimodal Benchmark -->
    <g transform="translate(1085, 310)">
      <circle cx="0" cy="0" r="62" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5"/>
      <text class="node-txt" x="0" y="-6" fill="#166534">VLM Score</text>
      <text class="node-sub" x="0" y="12" fill="#15803d">Score: 0.92</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#166534">Pass Gate</text>
    </g>

    <!-- Top Left Capsule -->
    <g transform="translate(30, 24)">
      <rect width="190" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#3b82f6"/>
      <text class="lbl" x="30" y="18">Multi-Probe Vision Flow</text>
    </g>

    <!-- Top Right Capsule -->
    <g transform="translate(980, 24)">
      <rect width="170" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#10b981"/>
      <text class="lbl" x="30" y="18">POPE + BBox Valid</text>
    </g>
  </g>
</svg>
