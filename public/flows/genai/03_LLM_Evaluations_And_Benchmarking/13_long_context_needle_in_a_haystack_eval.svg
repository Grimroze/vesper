<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .node-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; fill: #64748b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(60, 44)">
    <text class="title" x="0" y="0">Long-Context "Needle In A Haystack" Evaluation Flow</text>
    <text class="subtitle" x="0" y="22">Context pressure test: Depth variation (0-100%), token scaling (8K-1M), and retrieval recall heatmap</text>
  </g>

  <!-- Flow Canvas -->
  <g transform="translate(60, 95)">
    <rect width="1180" height="625" rx="24" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Left Circular Node: Needle Generator -->
    <g transform="translate(130, 200)">
      <circle cx="0" cy="0" r="64" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="52" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#92400e">Secret Needle</text>
      <text class="node-sub" x="0" y="12" fill="#b45309">Fact Token</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#d97706">key: "4819"</text>
    </g>

    <!-- Center Flow: 3 Curved Injection Paths at different depths (0%, 50%, 100%) -->
    <!-- Top Arc (0% Depth - Head) -->
    <path d="M 196 180 C 330 110, 470 110, 600 180" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <g transform="translate(390, 95)">
      <rect width="110" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="code" x="55" y="16" text-anchor="middle" fill="#2563eb">Depth: 10% (Top)</text>
    </g>

    <!-- Middle Arc (50% Depth - Lost in Middle) -->
    <path d="M 196 200 C 340 200, 470 200, 600 200" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
    <g transform="translate(385, 210)">
      <rect width="120" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="code" x="60" y="16" text-anchor="middle" fill="#6d28d9">Depth: 50% (Mid)</text>
    </g>

    <!-- Bottom Arc (95% Depth - Tail) -->
    <path d="M 196 220 C 330 290, 470 290, 600 220" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
    <g transform="translate(390, 290)">
      <rect width="110" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="code" x="55" y="16" text-anchor="middle" fill="#047857">Depth: 95% (Tail)</text>
    </g>

    <!-- Haystack Stream Background Capsule -->
    <g transform="translate(320, 150)">
      <rect width="250" height="100" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
      <text class="node-sub" x="125" y="55" fill="#64748b">Haystack Tokens (8K - 1M)</text>
    </g>

    <!-- Right Circular Node: Target LLM Context Ingestion -->
    <g transform="translate(680, 200)">
      <circle cx="0" cy="0" r="75" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="62" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-8" fill="#1e3a8a">Target LLM</text>
      <text class="node-sub" x="0" y="10" fill="#2563eb">Full Window</text>
      <text class="code" x="0" y="26" text-anchor="middle" fill="#1d4ed8">1M Context</text>
    </g>

    <!-- Curved Arrow from LLM to Retrieval Probe -->
    <path d="M 758 200 C 840 200, 890 200, 940 200" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Top Right Circular Node: Extraction Query -->
    <g transform="translate(1015, 200)">
      <circle cx="0" cy="0" r="64" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text class="node-txt" x="0" y="-6" fill="#4c1d95">Extraction</text>
      <text class="node-sub" x="0" y="12" fill="#6d28d9">"What is key?"</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#6d28d9">Output Check</text>
    </g>

    <!-- Downward Curved Flow from Extraction to Heatmap Matrix -->
    <path d="M 1015 266 C 1015 360, 850 430, 680 430" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <g transform="translate(850, 360)">
      <rect width="135" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="code" x="67" y="16" text-anchor="middle" fill="#047857">Verify Recall (1.0)</text>
    </g>

    <!-- Bottom: Pressure Test Recall Heatmap Simulation (Clean & Visual) -->
    <g transform="translate(180, 410)">
      <rect width="460" height="170" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text class="node-txt" x="230" y="28" fill="#0f172a">Recall Heatmap Matrix (Depth vs Length)</text>

      <!-- Grid of Colored Pills representing perfect retrieval -->
      <g transform="translate(45, 45)">
        <!-- Row 1: 8K tokens -->
        <text class="code" x="-35" y="18" fill="#64748b">8K</text>
        <rect x="0" y="5" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="75" y="5" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="150" y="5" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="225" y="5" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="300" y="5" width="65" height="18" rx="4" fill="#10b981"/>

        <!-- Row 2: 128K tokens -->
        <text class="code" x="-35" y="46" fill="#64748b">128K</text>
        <rect x="0" y="33" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="75" y="33" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="150" y="33" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="225" y="33" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="300" y="33" width="65" height="18" rx="4" fill="#10b981"/>

        <!-- Row 3: 1M tokens -->
        <text class="code" x="-35" y="74" fill="#64748b">1M</text>
        <rect x="0" y="61" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="75" y="61" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="150" y="61" width="65" height="18" rx="4" fill="#34d399"/>
        <rect x="225" y="61" width="65" height="18" rx="4" fill="#10b981"/>
        <rect x="300" y="61" width="65" height="18" rx="4" fill="#10b981"/>

        <!-- X-axis Labels -->
        <text class="code" x="20" y="98" fill="#64748b">0%</text>
        <text class="code" x="95" y="98" fill="#64748b">25%</text>
        <text class="code" x="170" y="98" fill="#64748b">50%</text>
        <text class="code" x="245" y="98" fill="#64748b">75%</text>
        <text class="code" x="315" y="98" fill="#64748b">100%</text>
      </g>
    </g>

    <!-- Top Left Capsule -->
    <g transform="translate(30, 24)">
      <rect width="180" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#f59e0b"/>
      <text class="lbl" x="30" y="18">Needle In A Haystack</text>
    </g>

    <!-- Top Right Capsule -->
    <g transform="translate(980, 24)">
      <rect width="170" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#10b981"/>
      <text class="lbl" x="30" y="18">Recall: 99.8%</text>
    </g>
  </g>
</svg>
