<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .node-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; fill: #64748b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(60, 44)">
    <text class="title" x="0" y="0">Human-In-The-Loop Active Audit &amp; Calibration Cycle</text>
    <text class="subtitle" x="0" y="22">Dual-stream flow: Automated fast-path acceptance paired with expert arbitration and inter-annotator agreement</text>
  </g>

  <!-- Flow Canvas -->
  <g transform="translate(60, 95)">
    <rect width="1180" height="625" rx="24" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Step 1: Production Prediction Stream (Circular Node) -->
    <g transform="translate(130, 310)">
      <circle cx="0" cy="0" r="66" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="0" r="54" fill="#f8fafc"/>
      <text class="node-txt" x="0" y="-6">Inference Stream</text>
      <text class="node-sub" x="0" y="12">100% Traffic</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#64748b">Live Calls</text>
    </g>

    <!-- Arrow to Confidence Router -->
    <path d="M 198 310 C 260 310, 300 310, 350 310" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Step 2: Confidence Filter (Center Circular Node) -->
    <g transform="translate(420, 310)">
      <circle cx="0" cy="0" r="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#1e3a8a">Confidence Gate</text>
      <text class="node-sub" x="0" y="12" fill="#2563eb">Threshold: 0.90</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#1d4ed8">Purity Check</text>
    </g>

    <!-- PATH A: High Confidence -> Green Curved Flow to Auto-Accept -->
    <path d="M 480 270 C 560 170, 720 160, 880 160" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <g transform="translate(640, 135)">
      <rect width="135" height="24" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
      <text class="code" x="67" y="16" text-anchor="middle" fill="#047857">High Conf &gt;= 0.90</text>
    </g>

    <!-- Terminal A: Auto-Accepted Production Output -->
    <g transform="translate(950, 160)">
      <circle cx="0" cy="0" r="64" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
      <text class="node-txt" x="0" y="-6" fill="#064e3b">Auto Accept</text>
      <text class="node-sub" x="0" y="12" fill="#047857">Fast-Path (95%)</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#047857">Zero Latency</text>
    </g>

    <!-- PATH B: Low Confidence -> Amber Curved Flow to Human Review -->
    <path d="M 480 350 C 540 440, 600 460, 680 460" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-amber)"/>
    <g transform="translate(520, 420)">
      <rect width="135" height="24" rx="12" fill="#ffffff" stroke="#fde68a"/>
      <text class="code" x="67" y="16" text-anchor="middle" fill="#b45309">Borderline &lt; 0.90</text>
    </g>

    <!-- Step 3: Human Reviewer Pool (Circular Node) -->
    <g transform="translate(750, 460)">
      <circle cx="0" cy="0" r="66" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#78350f">Expert Pool</text>
      <text class="node-sub" x="0" y="12" fill="#b45309">Dual Review</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#b45309">Annotators</text>
    </g>

    <!-- Arrow to Agreement Check -->
    <path d="M 818 460 C 860 460, 900 460, 930 460" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arr-amber)"/>

    <!-- Step 4: Inter-Annotator Agreement (Cohen's Kappa) -->
    <g transform="translate(1000, 460)">
      <circle cx="0" cy="0" r="66" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#4c1d95">Kappa Check</text>
      <text class="node-sub" x="0" y="12" fill="#6d28d9">Agreement</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#6d28d9">kappa &gt; 0.8</text>
    </g>

    <!-- Long Curved Feedback Loop (Agreement Gold -> Golden Dataset Bank) -->
    <path d="M 1000 528 C 1000 640, 130 640, 130 380" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-dasharray="5,5" marker-end="url(#arr-blue)"/>
    <g transform="translate(510, 625)">
      <rect width="190" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
      <text class="code" x="95" y="18" text-anchor="middle" fill="#1d4ed8">Feed Curated Gold to Prompt</text>
    </g>

    <!-- Top Left Capsule -->
    <g transform="translate(30, 24)">
      <rect width="180" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#3b82f6"/>
      <text class="lbl" x="30" y="18">HITL Audit Cycle</text>
    </g>

    <!-- Top Right Capsule -->
    <g transform="translate(980, 24)">
      <rect width="170" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#10b981"/>
      <text class="lbl" x="30" y="18">Active Learning</text>
    </g>
  </g>
</svg>
