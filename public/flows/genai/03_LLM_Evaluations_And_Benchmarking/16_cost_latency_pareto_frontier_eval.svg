<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .node-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; fill: #64748b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; }
    </style>

    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <g transform="translate(60, 44)">
    <text class="title" x="0" y="0">Cost-Latency Pareto Frontier &amp; Multi-Tier Routing Flow</text>
    <text class="subtitle" x="0" y="22">Multi-objective evaluation optimization: Routing requests across the Pareto efficiency boundary to minimize cost while meeting SLA</text>
  </g>

  <!-- Flow Canvas -->
  <g transform="translate(60, 95)">
    <rect width="1180" height="625" rx="24" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Left Circular Node: Request Router & Complexity Classifier -->
    <g transform="translate(140, 310)">
      <circle cx="0" cy="0" r="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="58" fill="#f8fafc"/>
      <text class="node-txt" x="0" y="-6">Prompt Router</text>
      <text class="node-sub" x="0" y="12">Complexity Eval</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#64748b">Classifier</text>
    </g>

    <!-- 3 Diverging Curved Flow Paths to 3 Pareto Model Tiers -->

    <!-- Tier 1 Flow (Top Curve -> Frontier Model) -->
    <path d="M 212 280 C 330 150, 470 140, 580 140" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>
    <g transform="translate(320, 160)">
      <rect width="145" height="24" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
      <text class="code" x="72" y="16" text-anchor="middle" fill="#6d28d9">Complex Reasoning</text>
    </g>

    <!-- Tier 1 Circular Node (Frontier) -->
    <g transform="translate(650, 140)">
      <circle cx="0" cy="0" r="66" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#4c1d95">Tier 1: Frontier</text>
      <text class="node-sub" x="0" y="12" fill="#6d28d9">GPT-4o / Claude</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#6d28d9">Eval: 92% | $5/M</text>
    </g>

    <!-- Tier 2 Flow (Middle Curve -> Mid-Tier Model) -->
    <path d="M 212 310 C 340 310, 470 310, 570 310" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <g transform="translate(330, 280)">
      <rect width="135" height="24" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
      <text class="code" x="67" y="16" text-anchor="middle" fill="#1d4ed8">Standard RAG</text>
    </g>

    <!-- Tier 2 Circular Node (Balanced) -->
    <g transform="translate(650, 310)">
      <circle cx="0" cy="0" r="66" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#1e3a8a">Tier 2: Balanced</text>
      <text class="node-sub" x="0" y="12" fill="#2563eb">Mini / Haiku</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#1d4ed8">Eval: 84% | $0.15/M</text>
    </g>

    <!-- Tier 3 Flow (Bottom Curve -> SLM / Edge) -->
    <path d="M 212 340 C 330 470, 470 480, 580 480" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <g transform="translate(320, 440)">
      <rect width="145" height="24" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text class="code" x="72" y="16" text-anchor="middle" fill="#047857">Simple Extraction</text>
    </g>

    <!-- Tier 3 Circular Node (Fast Edge) -->
    <g transform="translate(650, 480)">
      <circle cx="0" cy="0" r="66" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
      <text class="node-txt" x="0" y="-6" fill="#064e3b">Tier 3: Local</text>
      <text class="node-sub" x="0" y="12" fill="#047857">Llama 3 8B / vLLM</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#047857">Eval: 75% | $0.02/M</text>
    </g>

    <!-- Pareto Frontier Curve (Graceful Arc connecting the 3 models) -->
    <path d="M 720 140 C 760 220, 760 400, 720 480" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,6"/>
    <g transform="translate(755, 300)">
      <rect width="130" height="24" rx="12" fill="#fffbeb" stroke="#fde68a"/>
      <text class="lbl" x="65" y="16" text-anchor="middle" fill="#b45309">Pareto Frontier</text>
    </g>

    <!-- Reconverging Curved Paths into Terminal Delivery -->
    <path d="M 718 140 C 850 140, 940 240, 985 280" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
    <path d="M 718 310 C 820 310, 890 310, 950 310" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <path d="M 718 480 C 850 480, 940 380, 985 340" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Terminal Circular Node: Unified Delivery -->
    <g transform="translate(1030, 310)">
      <circle cx="0" cy="0" r="68" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5"/>
      <text class="node-txt" x="0" y="-6" fill="#166534">Optimal Delivery</text>
      <text class="node-sub" x="0" y="12" fill="#15803d">SLA Satisfied</text>
      <text class="code" x="0" y="28" text-anchor="middle" fill="#166534">Cost Saved: 80%</text>
    </g>

    <!-- Top Left Capsule -->
    <g transform="translate(30, 24)">
      <rect width="190" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#3b82f6"/>
      <text class="lbl" x="30" y="18">Dynamic Model Routing</text>
    </g>

    <!-- Top Right Capsule -->
    <g transform="translate(980, 24)">
      <rect width="170" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="16" cy="14" r="5" fill="#f59e0b"/>
      <text class="lbl" x="30" y="18">Pareto Optimized</text>
    </g>
  </g>
</svg>
