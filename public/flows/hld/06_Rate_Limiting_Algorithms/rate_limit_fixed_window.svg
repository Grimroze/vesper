<svg width="100%" viewBox="0 0 800 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Fixed Window Counter: The Boundary Burst Problem</title>
<desc>Diagram showing the fixed window counter rate limiting algorithm and its critical boundary condition flaw allowing 2x traffic spikes at window reset boundaries</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Rate Limiting: Fixed Window Counter &amp; The 2x Flaw</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Fixed time slots (e.g. 1 min) reset counters on the minute, permitting double the allowed limit across boundary edges</text>

<!-- ============================================== -->
<!-- TIMELINE GRAPH CONTAINER                       -->
<!-- ============================================== -->
<rect x="25" y="80" width="710" height="255" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="105" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">TIMELINE: LIMIT = 100 REQUESTS / MINUTE</text>

<!-- Window 1 (10:00:00 to 10:01:00) -->
<rect x="60" y="130" width="310" height="120" rx="6" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.8"/>
<text x="75" y="150" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Window 1: 10:00:00 – 10:01:00</text>
<text x="75" y="170" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Idle for first 58 seconds (0 reqs)</text>

<!-- Burst 1 at end of Window 1 (10:00:59) -->
<rect x="235" y="185" width="125" height="50" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:1"/>
<text x="297" y="202" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:11px;font-weight:700">100 Requests</text>
<text x="297" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:600">at 10:00:59 (Allowed)</text>

<!-- Boundary Line (Reset Point) -->
<line x1="380" y1="110" x2="380" y2="280" stroke="rgb(153, 60, 29)" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="335" y="112" width="90" height="22" rx="4" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.6"/>
<text x="380" y="123" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:9px;font-weight:700">RESET TO 0</text>

<!-- Window 2 (10:01:00 to 10:02:00) -->
<rect x="390" y="130" width="310" height="120" rx="6" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.8"/>
<text x="405" y="150" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Window 2: 10:01:00 – 10:02:00</text>
<text x="405" y="170" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:400">Fresh quota starts at 10:01:00</text>

<!-- Burst 2 at start of Window 2 (10:01:01) -->
<rect x="400" y="185" width="125" height="50" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:1"/>
<text x="462" y="202" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:11px;font-weight:700">100 Requests</text>
<text x="462" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:600">at 10:01:01 (Allowed)</text>

<!-- The 2-Second Spike Bracket (Between 10:00:59 and 10:01:01) -->
<path d="M 235 255 L 235 270 L 525 270 L 525 255" fill="none" stroke="rgb(153, 60, 29)" stroke-width="2"/>
<rect x="270" y="280" width="220" height="36" rx="6" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:1"/>
<text x="380" y="298" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:700">200 Requests in 2 Seconds!</text>

<!-- ============================================== -->
<!-- BOTTOM ANALYSIS SECTION                        -->
<!-- ============================================== -->
<g transform="translate(25, 350)">
  <rect width="345" height="95" rx="8" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
  <text x="15" y="22" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Why It Passes Counter Check:</text>
  <text x="15" y="42" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Window 1 count = 100/100 (Legal)</text>
  <text x="15" y="58" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Window 2 count = 100/100 (Legal)</text>
  <text x="15" y="74" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">• But rolling 1-minute window sees 2x allowed capacity!</text>

  <rect x="365" y="0" width="345" height="95" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:1"/>
  <text x="380" y="22" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">The Fix: Sliding Window Log / Counter</text>
  <text x="380" y="42" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Evaluates a rolling 60-second frame from NOW</text>
  <text x="380" y="58" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">• Blends percentage of previous window</text>
  <text x="380" y="74" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">• Completely prevents 2x boundary spikes</text>
</g>

<!-- Global Footer -->
<text x="380" y="465" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Rate Limiting Algorithms • Fixed Window Boundary Bug</text>
</svg>