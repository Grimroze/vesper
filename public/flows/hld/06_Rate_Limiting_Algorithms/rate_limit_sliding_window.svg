<svg width="100%" viewBox="0 0 800 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sliding Window Counter Rate Limiting Algorithm</title>
<desc>Diagram showing the weighted sliding window counter algorithm that smoothly calculates request rates across rolling boundaries without 2x spikes</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Rate Limiting: Sliding Window Counter</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Blends previous and current window counters weighted by time elapsed to ensure smooth, burst-proof rate limiting</text>

<!-- ============================================== -->
<!-- TIMELINE CONTAINER                             -->
<!-- ============================================== -->
<rect x="25" y="80" width="710" height="240" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
<text x="45" y="105" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">CONTINUOUS ROLLING TIME WINDOW</text>

<!-- Previous Window (10:00 - 10:01) -->
<rect x="60" y="130" width="310" height="80" rx="6" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.8"/>
<text x="75" y="152" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Previous Minute (10:00 – 10:01)</text>
<text x="75" y="172" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Total Count = 100 requests</text>

<!-- Current Window (10:01 - 10:02) -->
<rect x="380" y="130" width="310" height="80" rx="6" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:0.8"/>
<text x="395" y="152" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Current Minute (10:01 – 10:02)</text>
<text x="395" y="172" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">Current Count = 30 requests so far</text>

<!-- Rolling 60s Frame (Overlapping 70% of Prev + 30% of Curr) -->
<rect x="150" y="225" width="310" height="75" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:1.5"/>
<text x="165" y="246" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">ROLLING 60-SECOND WINDOW (At 10:01:18 — 30% into current minute)</text>
<text x="165" y="266" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:11px;font-weight:600">Overlaps 70% of Previous (70 reqs) + 30% of Current (30 reqs)</text>
<text x="165" y="284" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:11px;font-weight:700">Total Rolling Count = 70 + 30 = 100 (Quota reached! Next request → 429)</text>

<!-- Current Time Indicator Line (At 10:01:18) -->
<line x1="460" y1="120" x2="460" y2="305" stroke="rgb(15, 110, 86)" stroke-width="2"/>
<rect x="420" y="112" width="80" height="20" rx="3" style="fill:rgb(15, 110, 86)"/>
<text x="460" y="122" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:9px;font-weight:700">NOW (30%)</text>

<!-- ============================================== -->
<!-- BOTTOM: MATHEMATICAL FORMULA & PROS            -->
<!-- ============================================== -->
<g transform="translate(25, 335)">
  <!-- Formula Box -->
  <rect width="400" height="110" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(229, 231, 235);stroke-width:1"/>
  <text x="15" y="22" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">The Weighting Formula:</text>
  <rect x="15" y="38" width="370" height="34" rx="4" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:0.6"/>
  <text x="200" y="55" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:ui-monospace, monospace;font-size:10px;font-weight:700">Requests = CurrCount + PrevCount × (1 - TimeElapsed%)</text>
  <text x="15" y="90" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Assumes even distribution over the prior minute; 99.9% accurate.</text>

  <!-- Cloudflare / Production Benefit Box -->
  <rect x="415" y="0" width="295" height="110" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:1"/>
  <text x="430" y="22" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Why Cloudflare Uses It:</text>
  <text x="430" y="44" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">No 2x Boundary Spike:</text>
  <text x="550" y="44" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Smooth rolling count</text>
  <text x="430" y="64" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Low Memory (O(1)):</text>
  <text x="545" y="64" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Stores only 2 numbers in Redis</text>
  <text x="430" y="86" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:9px;font-weight:400">Does not store full timestamp arrays!</text>
</g>

<!-- Global Footer -->
<text x="380" y="465" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Rate Limiting Algorithms • Sliding Window Counter</text>
</svg>