<svg width="100%" viewBox="0 0 800 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Token Bucket Rate Limiting Algorithm</title>
  <desc>Diagram showing circular tokens constantly refilling a finite bucket at rate r, incoming requests consuming tokens, and handling traffic bursts versus rate limits</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L8 5L1 8" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Rate Limiting: Token Bucket Algorithm</text>
  <text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Tokens refill steadily at rate r up to capacity B; each request consumes 1 token. Allows short bursts up to B</text>

  <!-- ============================================== -->
  <!-- LEFT: THE TOKEN BUCKET VESSEL                  -->
  <!-- ============================================== -->
  <rect x="25" y="80" width="370" height="340" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>

  <!-- Refill Dispenser (Top) -->
  <rect x="155" y="95" width="110" height="28" rx="4" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.8"/>
  <text x="210" y="109" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">Refill: r tokens/sec</text>

  <!-- Dripping Token Flow with Circular Coin -->
  <path d="M 210 123 L 210 138" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Falling Circular Token -->
  <circle cx="210" cy="148" r="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <circle cx="210" cy="148" r="6.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
  <text x="210" y="148" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:8px;font-weight:700">T</text>
  
  <path d="M 210 158 L 210 170" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <text x="252" y="148" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:500">+1 Token</text>

  <!-- Stylized Tapered Bucket (Vessel) -->
  <path d="M 125 175 L 145 320 Q 145 330, 155 330 L 265 330 Q 275 330, 275 320 L 295 175" fill="rgb(255, 255, 255)" stroke="rgb(133, 79, 11)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Water / Token Level fill inside bucket -->
  <path d="M 137 232 L 145 320 Q 145 328, 155 328 L 265 328 Q 275 328, 275 320 L 283 232 Z" fill="rgb(250, 238, 218)" opacity="0.45"/>

  <!-- ==================== CIRCULAR TOKENS INSIDE BUCKET ==================== -->
  <!-- Row 1 (Bottom Row): 4 Circular Tokens -->
  <g transform="translate(0, 0)">
    <!-- Token 1 -->
    <circle cx="170" cy="308" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="170" cy="308" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="170" y="308" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 2 -->
    <circle cx="197" cy="308" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="197" cy="308" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="197" y="308" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 3 -->
    <circle cx="223" cy="308" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="223" cy="308" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="223" y="308" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 4 -->
    <circle cx="250" cy="308" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="250" cy="308" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="250" y="308" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>
  </g>

  <!-- Row 2 (Middle Row): 3 Circular Tokens -->
  <g transform="translate(0, 0)">
    <!-- Token 5 -->
    <circle cx="183" cy="284" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="183" cy="284" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="183" y="284" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 6 -->
    <circle cx="210" cy="284" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="210" cy="284" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="210" y="284" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 7 -->
    <circle cx="237" cy="284" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="237" cy="284" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="237" y="284" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>
  </g>

  <!-- Row 3 (Top Row): 4 Circular Tokens -->
  <g transform="translate(0, 0)">
    <!-- Token 8 -->
    <circle cx="168" cy="260" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="168" cy="260" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="168" y="260" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 9 -->
    <circle cx="196" cy="260" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="196" cy="260" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="196" y="260" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 10 -->
    <circle cx="224" cy="260" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="224" cy="260" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="224" y="260" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>

    <!-- Token 11 -->
    <circle cx="252" cy="260" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="252" cy="260" r="9.5" fill="none" stroke="#fde68a" stroke-width="0.8"/>
    <text x="252" y="260" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:10px;font-weight:700">T</text>
  </g>

  <!-- Overlay Badge: Tokens Available -->
  <rect x="145" y="222" width="130" height="20" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="210" y="232" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:ui-monospace, monospace;font-size:9.5px;font-weight:700">Tokens Available: 11</text>

  <!-- Capacity and Overflow info -->
  <text x="210" y="358" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Bucket Capacity = B tokens (max burst)</text>
  <text x="210" y="375" text-anchor="middle" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:500">Overflow tokens are discarded when full</text>

  <!-- ============================================== -->
  <!-- RIGHT: REQUEST ARRIVAL & DECISION LOGIC        -->
  <!-- ============================================== -->
  <rect x="415" y="80" width="350" height="340" rx="10" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
  <text x="435" y="105" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">REQUEST PROCESSING &amp; OUTCOMES</text>

  <!-- Incoming Request -->
  <rect x="435" y="125" width="310" height="48" rx="6" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.8"/>
  <text x="450" y="142" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">Incoming API Request</text>
  <text x="450" y="158" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:10px;font-weight:500">GET /api/v1/orders (Costs 1 token)</text>

  <!-- Split Arrow Path -->
  <path d="M 590 173 C 590 195, 510 195, 510 215" fill="none" stroke="rgb(15, 110, 86)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 590 173 C 590 195, 670 195, 670 215" fill="none" stroke="rgb(153, 60, 29)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Case A: Token Available -->
  <rect x="435" y="220" width="150" height="85" rx="6" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.8"/>
  <text x="510" y="238" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:700">Tokens &gt; 0</text>
  <g transform="translate(470, 248)">
    <circle cx="8" cy="8" r="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="8" y="8" text-anchor="middle" dominant-baseline="central" style="fill:#92400e;font-family:ui-monospace, monospace;font-size:6px;font-weight:700">T</text>
    <text x="18" y="8" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:9.5px;font-weight:600">-1 Token</text>
  </g>
  <rect x="445" y="270" width="130" height="24" rx="4" style="fill:rgb(15, 110, 86)"/>
  <text x="510" y="282" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:10px;font-weight:700">200 OK (Forwarded)</text>

  <!-- Case B: Empty Bucket -->
  <rect x="595" y="220" width="150" height="85" rx="6" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.8"/>
  <text x="670" y="238" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:700">Tokens == 0</text>
  <text x="670" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:9.5px;font-weight:500">No token available</text>
  <rect x="605" y="270" width="130" height="24" rx="4" style="fill:rgb(153, 60, 29)"/>
  <text x="670" y="282" text-anchor="middle" dominant-baseline="central" style="fill:rgb(255, 255, 255);font-family:ui-monospace, monospace;font-size:10px;font-weight:700">429 Rate Limited</text>

  <!-- Summary Characteristics -->
  <rect x="435" y="320" width="310" height="85" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(229, 231, 235);stroke-width:0.8"/>
  <text x="445" y="336" dominant-baseline="central" style="fill:rgb(55, 65, 81);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Key Superpower &amp; Trade-off:</text>
  <text x="445" y="352" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Handles Bursts:</text>
  <text x="530" y="352" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Can serve B requests at once</text>
  <text x="445" y="370" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Memory Efficient:</text>
  <text x="545" y="370" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Only 2 numbers in Redis</text>
  <text x="445" y="388" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:ui-monospace, monospace;font-size:9px;font-weight:400">Redis: {tokens_remaining, last_refill_timestamp}</text>

  <!-- Bottom Architecture Note -->
  <text x="400" y="450" text-anchor="middle" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Used by Stripe, AWS, and OpenAI because it allows users to make rapid burst calls without failing immediately</text>
</svg>