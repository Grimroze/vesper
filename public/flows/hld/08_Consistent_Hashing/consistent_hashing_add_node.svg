<svg width="100%" viewBox="0 0 760 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Consistent Hashing: Adding a New Node with Minimal Key Movement</title>
<desc>Diagram showing that adding Node D only migrates a tiny subset of keys from Node C to Node D, leaving all other nodes completely unaffected</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Consistent Hashing: Adding a Node (Minimal Migration)</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Only K/N keys are moved; unlike naive modulo hashing where almost 100% of keys cause a cache avalanche</text>

<!-- Outer Canvas Track -->
<circle cx="330" cy="290" r="175" fill="none" stroke="rgb(229, 231, 235)" stroke-width="16"/>

<!-- Highlight Migrated Arc in Coral/Red (Between B and D) -->
<path d="M 502 260 A 175 175 0 0 1 445 425" fill="none" stroke="rgb(250, 236, 231)" stroke-width="16"/>
<path d="M 502 260 A 175 175 0 0 1 445 425" fill="none" stroke="rgb(153, 60, 29)" stroke-width="2" stroke-dasharray="4 4"/>

<!-- Existing Node A (~330 deg: Top Left) -->
<circle cx="218" cy="155" r="20" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:2"/>
<text x="218" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node A</text>
<rect x="90" y="140" width="105" height="26" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="142" y="153" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">0% Keys Moved (Unaffected)</text>

<!-- Existing Node B (~80 deg: Right) -->
<circle cx="502" cy="260" r="20" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:2"/>
<text x="502" y="260" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node B</text>
<rect x="535" y="247" width="105" height="26" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="587" y="260" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">0% Keys Moved (Unaffected)</text>

<!-- NEW NODE D ADDED (Bottom-Right: ~135 deg) -->
<circle cx="445" cy="425" r="24" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:2.5"/>
<text x="445" y="425" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node D</text>
<rect x="400" y="465" width="135" height="30" rx="4" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.8"/>
<text x="467" y="480" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:10px;font-weight:700">+ NEW NODE ADDED</text>

<!-- Existing Node C (~220 deg: Bottom Left) -->
<circle cx="200" cy="385" r="20" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:2"/>
<text x="200" y="385" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node C</text>
<rect x="65" y="372" width="115" height="26" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(133, 79, 11);stroke-width:0.5"/>
<text x="122" y="385" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">Transfers subset to D</text>

<!-- Key Migrating: Key K4 -->
<circle cx="485" cy="335" r="8" style="fill:rgb(153, 60, 29);stroke:rgb(255, 255, 255);stroke-width:1.5"/>
<rect x="500" y="325" width="85" height="22" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(153, 60, 29);stroke-width:0.6"/>
<text x="542" y="336" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">k4: re-assigned</text>

<!-- Arrow showing k4 now routes to Node D instead of C -->
<path d="M 485 345 A 175 175 0 0 1 455 405" fill="none" stroke="rgb(153, 60, 29)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- Center Inside Ring Explanation -->
<text x="330" y="275" text-anchor="middle" dominant-baseline="central" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Minimal Rehash</text>
<text x="330" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:11px;font-weight:700">Only 1/N keys move!</text>
<text x="330" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Node C offloads its share</text>

<!-- Right Side Comparison Card -->
<g transform="translate(540, 110)">
  <rect width="195" height="340" rx="8" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
  
  <text x="15" y="25" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">Modulo vs Consistent:</text>

  <!-- Modulo failure -->
  <rect x="15" y="42" width="165" height="110" rx="6" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:0.8"/>
  <text x="25" y="58" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:700">Naive Modulo (hash % N)</text>
  <text x="25" y="78" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">When N becomes N+1:</text>
  <text x="25" y="94" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:ui-monospace, monospace;font-size:10px;font-weight:700">~99% Keys Remapped!</text>
  <text x="25" y="112" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">Cache misses spike to 100%,</text>
  <text x="25" y="126" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">overwhelming the database.</text>

  <!-- Consistent Hashing success -->
  <rect x="15" y="165" width="165" height="120" rx="6" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.8"/>
  <text x="25" y="182" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:700">Consistent Hashing</text>
  <text x="25" y="202" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">When adding server D:</text>
  <text x="25" y="218" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:10px;font-weight:700">Only K/N Keys Move!</text>
  <text x="25" y="236" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">Nodes A and B keep all</text>
  <text x="25" y="250" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:9px;font-weight:400">their cached data.</text>
  <text x="25" y="266" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:ui-monospace, monospace;font-size:9px;font-weight:600">Zero cache stampede!</text>
</g>

<!-- Global Footer -->
<text x="330" y="530" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Consistent Hashing Scalability • Node Addition</text>
</svg>