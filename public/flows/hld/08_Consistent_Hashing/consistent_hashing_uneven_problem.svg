<svg width="100%" viewBox="0 0 760 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Consistent Hashing: The Non-Uniform Hotspot Problem</title>
<desc>Diagram showing how sparse physical nodes can cluster unevenly on the hash ring, creating severe hotspot partitions and server crashes</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 2L8 5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Header -->
<text x="40" y="38" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:16px;font-weight:600">Consistent Hashing: The Uneven Partition Problem (Hotspot)</text>
<text x="40" y="56" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:400">Without virtual nodes, random hashing clusters servers unevenly, burying one node under 75%+ of all traffic</text>

<!-- Outer Canvas Track -->
<circle cx="330" cy="290" r="175" fill="none" stroke="rgb(229, 231, 235)" stroke-width="18"/>

<!-- Giant Overloaded Arc for Node C (from Node B at 65 deg clockwise all the way to Node C at 260 deg) -->
<!-- Highlighting the massive span owned by Node C in coral/red -->
<path d="M 453 216 A 175 175 0 1 1 206 413" fill="none" stroke="rgb(250, 236, 231)" stroke-width="18"/>
<path d="M 453 216 A 175 175 0 1 1 206 413" fill="none" stroke="rgb(153, 60, 29)" stroke-width="2" stroke-dasharray="6 4"/>

<!-- Node A (Top: ~20 deg) -->
<circle cx="390" cy="118" r="20" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:2"/>
<text x="390" y="118" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node A</text>

<!-- Node B (Clustered right next to Node A: ~50 deg) -->
<circle cx="465" cy="205" r="20" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:2"/>
<text x="465" y="205" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node B</text>

<!-- Node C (Isolated way across at ~250 deg) -->
<circle cx="195" cy="405" r="24" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:2.5"/>
<text x="195" y="405" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:700">Node C</text>

<!-- Partition Spans Annotation -->
<rect x="420" y="145" width="100" height="24" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(83, 74, 183);stroke-width:0.5"/>
<text x="470" y="157" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">A's share: 11%</text>

<rect x="490" y="225" width="100" height="24" rx="4" style="fill:rgb(255, 255, 255);stroke:rgb(15, 110, 86);stroke-width:0.5"/>
<text x="540" y="237" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:ui-monospace, monospace;font-size:10px;font-weight:600">B's share: 14%</text>

<!-- Massive Node C Load Badge -->
<rect x="65" y="445" width="220" height="45" rx="6" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29);stroke-width:1"/>
<text x="175" y="460" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:700">CRITICAL HOTSPOT: 75% Load!</text>
<text x="175" y="476" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Node C handles 3 out of every 4 requests</text>

<!-- Center Explanatory Text inside Ring -->
<text x="330" y="275" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:13px;font-weight:600">Non-Uniform Space</text>
<text x="330" y="295" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Nodes A and B hashed</text>
<text x="330" y="310" text-anchor="middle" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">too close together</text>

<!-- Right Side Details Card -->
<g transform="translate(540, 110)">
  <rect width="195" height="340" rx="8" style="fill:rgb(249, 250, 251);stroke:rgb(229, 231, 235);stroke-width:1"/>
  
  <text x="15" y="25" style="fill:rgb(17, 24, 39);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:12px;font-weight:600">The 2 Severe Flaws:</text>

  <rect x="15" y="42" width="165" height="75" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(229, 231, 235);stroke-width:0.8"/>
  <text x="25" y="58" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">1. Uneven Partitions</text>
  <text x="25" y="76" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">It is statistically impossible</text>
  <text x="25" y="90" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">to guarantee uniform</text>
  <text x="25" y="104" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">spacing with 3–5 servers.</text>

  <rect x="15" y="128" width="165" height="85" rx="6" style="fill:rgb(255, 255, 255);stroke:rgb(229, 231, 235);stroke-width:0.8"/>
  <text x="25" y="144" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">2. Cascading Failure</text>
  <text x="25" y="162" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">If Node C crashes under</text>
  <text x="25" y="176" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">its 75% load, its keys</text>
  <text x="25" y="190" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">all dump onto Node A,</text>
  <text x="25" y="204" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">crashing Node A next!</text>

  <rect x="15" y="225" width="165" height="95" rx="6" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.8"/>
  <text x="25" y="242" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:600">The Industry Fix:</text>
  <text x="25" y="260" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:600">Virtual Nodes (vnodes)</text>
  <text x="25" y="278" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">Each server gets 100–300</text>
  <text x="25" y="292" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">virtual points interleaved</text>
  <text x="25" y="306" dominant-baseline="central" style="fill:rgb(107, 114, 128);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:10px;font-weight:400">evenly across the ring.</text>
</g>

<!-- Global Footer -->
<text x="330" y="530" text-anchor="middle" style="fill:rgb(156, 163, 175);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;font-size:11px;font-weight:400">Consistent Hashing Failure Modes • Non-Uniform Hotspots</text>
</svg>