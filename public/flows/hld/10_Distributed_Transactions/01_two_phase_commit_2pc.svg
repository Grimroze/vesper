<svg width="100%" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">Two-Phase Commit (2PC) protocol</title>
<desc style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">Two-phase commit showing Phase 1 (Prepare and Vote) and Phase 2 (Global Commit or Abort) coordinated across distributed database nodes</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Phase 1 Container (Left) -->
<rect x="20" y="20" width="345" height="340" rx="14" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);opacity:0.45"/>
<text x="192" y="46" text-anchor="middle" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Phase 1 — Prepare (voting phase)</text>
<text x="192" y="64" text-anchor="middle" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">coordinator asks if all nodes are ready to commit</text>

<!-- Phase 1 Coordinator -->
<rect x="112" y="88" width="160" height="54" rx="10" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183)"/>
<text x="192" y="108" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Coordinator</text>
<text x="192" y="127" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">transaction manager</text>

<!-- Phase 1 Arrows: Prepare & Vote -->
<line x1="150" y1="142" x2="95" y2="232" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="90" y="182" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">1. prepare?</text>

<line x1="120" y1="234" x2="172" y2="146" marker-end="url(#arrow)" style="fill:none;stroke:rgb(0, 119, 99);stroke-width:1.5px;stroke-dasharray:4 3"/>
<text x="156" y="204" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">2. vote YES</text>

<line x1="234" y1="142" x2="289" y2="232" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="294" y="182" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">1. prepare?</text>

<line x1="264" y1="234" x2="212" y2="146" marker-end="url(#arrow)" style="fill:none;stroke:rgb(0, 119, 99);stroke-width:1.5px;stroke-dasharray:4 3"/>
<text x="228" y="204" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">2. vote YES</text>

<!-- Phase 1 Participants -->
<rect x="40" y="236" width="135" height="64" rx="8" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11)"/>
<text x="107" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Order DB</text>
<text x="107" y="274" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">writes undo/redo log,</text>
<text x="107" y="289" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">holds row lock</text>

<rect x="210" y="236" width="135" height="64" rx="8" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11)"/>
<text x="277" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Payment DB</text>
<text x="277" y="274" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">writes undo/redo log,</text>
<text x="277" y="289" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">holds row lock</text>

<text x="192" y="335" text-anchor="middle" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">resources stay locked until Phase 2 finishes</text>

<!-- Phase 2 Container (Right) -->
<rect x="395" y="20" width="345" height="340" rx="14" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);opacity:0.45"/>
<text x="567" y="46" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Phase 2 — Commit or Abort (decision phase)</text>
<text x="567" y="64" text-anchor="middle" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">all voted YES → commit; any voted NO → abort all</text>

<!-- Phase 2 Coordinator -->
<rect x="487" y="88" width="160" height="54" rx="10" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183)"/>
<text x="567" y="108" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Coordinator</text>
<text x="567" y="127" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">logs global decision</text>

<!-- Phase 2 Arrows -->
<line x1="530" y1="142" x2="482" y2="232" marker-end="url(#arrow)" style="fill:none;stroke:rgb(0, 119, 99);stroke-width:1.5px"/>
<text x="470" y="188" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">3. commit!</text>

<line x1="604" y1="142" x2="652" y2="232" marker-end="url(#arrow)" style="fill:none;stroke:rgb(0, 119, 99);stroke-width:1.5px"/>
<text x="664" y="188" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">3. commit!</text>

<!-- Phase 2 Participants -->
<rect x="415" y="236" width="135" height="64" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="482" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Order DB</text>
<text x="482" y="274" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">commits &amp; releases</text>
<text x="482" y="289" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">lock → sends ACK</text>

<rect x="585" y="236" width="135" height="64" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="652" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Payment DB</text>
<text x="652" y="274" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">commits &amp; releases</text>
<text x="652" y="289" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">lock → sends ACK</text>

<text x="567" y="335" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">strong consistency, but slow and blocking</text>

<!-- Bottom Tradeoff Caption -->
<text x="380" y="395" text-anchor="middle" style="fill:rgb(153, 60, 29);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500">Tradeoff: Coordinator is a single point of failure (SPOF) — if it crashes after Phase 1, participants stay blocked holding locks</text>
</svg>
