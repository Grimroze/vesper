<svg width="100%" viewBox="0 0 780 390" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">Saga Pattern: Choreography versus Orchestration</title>
<desc style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">Comparison between Saga Choreography where services react to domain events via a message broker without a central controller, and Saga Orchestration where a central orchestrator coordinates each step</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Left Panel: Choreography -->
<rect x="20" y="20" width="355" height="325" rx="14" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);opacity:0.55"/>
<text x="197" y="46" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">1. Saga Choreography (event-driven)</text>
<text x="197" y="64" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">no central controller — services react to events</text>

<!-- Choreography Services -->
<rect x="55" y="90" width="115" height="44" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="112" y="106" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Order Service</text>
<text x="112" y="122" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">local DB write</text>

<line x1="170" y1="112" x2="225" y2="112" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="275" y="104" text-anchor="middle" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">OrderCreated</text>
<rect x="228" y="95" width="95" height="34" rx="6" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11)"/>
<text x="275" y="112" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">Event Bus</text>

<line x1="228" y1="125" x2="172" y2="164" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<rect x="55" y="160" width="115" height="44" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="112" y="176" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Payment Svc</text>
<text x="112" y="192" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">charges card</text>

<line x1="170" y1="182" x2="225" y2="182" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="275" y="174" text-anchor="middle" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">PaymentBilled</text>
<rect x="228" y="165" width="95" height="34" rx="6" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11)"/>
<text x="275" y="182" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">Event Bus</text>

<line x1="228" y1="195" x2="172" y2="234" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>

<rect x="55" y="230" width="115" height="44" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="112" y="246" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Inventory Svc</text>
<text x="112" y="262" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">reserves stock</text>

<text x="197" y="305" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">Good for: 2–3 simple services, loose coupling</text>
<text x="197" y="323" text-anchor="middle" style="fill:rgb(153, 60, 29);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">Risk: cyclic events &amp; hard to track when &gt;4 services</text>

<!-- Right Panel: Orchestration -->
<rect x="405" y="20" width="355" height="325" rx="14" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);opacity:0.55"/>
<text x="582" y="46" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">2. Saga Orchestration (command-driven)</text>
<text x="582" y="64" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">central state machine commands each service</text>

<!-- Central Orchestrator Box -->
<rect x="482" y="88" width="200" height="54" rx="10" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183)"/>
<text x="582" y="108" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">Saga Orchestrator</text>
<text x="582" y="126" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">tracks workflow state &amp; rollbacks</text>

<!-- Arrows from Orchestrator to 3 Services -->
<line x1="520" y1="142" x2="468" y2="218" marker-end="url(#arrow)" style="fill:none;stroke:rgb(83, 74, 183);stroke-width:1.5px"/>
<text x="466" y="180" text-anchor="middle" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">1. create</text>

<line x1="582" y1="142" x2="582" y2="218" marker-end="url(#arrow)" style="fill:none;stroke:rgb(83, 74, 183);stroke-width:1.5px"/>
<text x="612" y="185" text-anchor="middle" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">2. charge</text>

<line x1="644" y1="142" x2="696" y2="218" marker-end="url(#arrow)" style="fill:none;stroke:rgb(83, 74, 183);stroke-width:1.5px"/>
<text x="702" y="180" text-anchor="middle" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">3. reserve</text>

<!-- Orchestrated Services -->
<rect x="420" y="222" width="98" height="48" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="469" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500">Order Svc</text>
<text x="469" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:10px;font-weight:400">step 1</text>

<rect x="533" y="222" width="98" height="48" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="582" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500">Payment Svc</text>
<text x="582" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:10px;font-weight:400">step 2</text>

<rect x="646" y="222" width="98" height="48" rx="8" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="695" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500">Inventory Svc</text>
<text x="695" y="256" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:10px;font-weight:400">step 3</text>

<text x="582" y="305" text-anchor="middle" style="fill:rgb(60, 52, 137);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">Good for: complex workflows (4+ steps), easy debugging</text>
<text x="582" y="323" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">Used with Temporal, AWS Step Functions, Camunda</text>

<!-- Bottom Summary -->
<text x="390" y="370" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Each service commits locally (ACID) — eventual consistency across services is achieved via compensating transactions</text>
</svg>
