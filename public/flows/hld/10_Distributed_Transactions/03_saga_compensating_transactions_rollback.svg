<svg width="100%" viewBox="0 0 780 390" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">Saga Compensating Transactions (Rollback Flow)</title>
<desc style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;">When a step fails in a Saga, previously committed local transactions are undone in reverse order using compensating transactions</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Forward Flow Row Header -->
<text x="40" y="38" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Forward execution (local ACID commits)</text>

<!-- Step 1: Order Service -->
<rect x="40" y="55" width="190" height="75" rx="10" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="135" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">1. Order Service</text>
<text x="135" y="98" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">creates order #101</text>
<text x="135" y="114" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">status = PENDING (committed)</text>

<line x1="230" y1="92" x2="292" y2="92" marker-end="url(#arrow)" style="fill:none;stroke:rgb(0, 119, 99);stroke-width:1.5px"/>
<text x="261" y="80" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">next</text>

<!-- Step 2: Payment Service -->
<rect x="295" y="55" width="190" height="75" rx="10" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86)"/>
<text x="390" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">2. Payment Service</text>
<text x="390" y="98" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">deducts $50 from user</text>
<text x="390" y="114" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">status = CHARGED (committed)</text>

<line x1="485" y1="92" x2="547" y2="92" marker-end="url(#arrow)" style="fill:none;stroke:rgb(0, 119, 99);stroke-width:1.5px"/>
<text x="516" y="80" text-anchor="middle" style="fill:rgb(8, 80, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:400">next</text>

<!-- Step 3: Inventory Service (FAILS!) -->
<rect x="550" y="55" width="190" height="75" rx="10" stroke-width="1" style="fill:rgb(250, 236, 231);stroke:rgb(153, 60, 29)"/>
<text x="645" y="78" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">3. Inventory Service</text>
<text x="645" y="98" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">item out of stock!</text>
<text x="645" y="114" text-anchor="middle" dominant-baseline="central" style="fill:rgb(142, 38, 38);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">FAILS → triggers rollback</text>

<!-- Trigger Arrow Down from Step 3 to Step 4 -->
<path d="M645 130 L645 255 L488 255" fill="none" stroke="rgb(142, 38, 38)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="605" y="242" text-anchor="middle" style="fill:rgb(142, 38, 38);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500">trigger compensation in reverse</text>

<!-- Backward Rollback Header -->
<text x="40" y="200" style="fill:rgb(113, 43, 19);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:500">Backward recovery (compensating transactions undo committed work)</text>

<!-- Step 4: Compensate Payment -->
<rect x="295" y="218" width="190" height="75" rx="10" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11)"/>
<text x="390" y="241" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">4. Refund Payment</text>
<text x="390" y="261" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">credits +$50 back to user</text>
<text x="390" y="277" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">status = REFUNDED</text>

<line x1="295" y1="255" x2="233" y2="255" marker-end="url(#arrow)" style="fill:none;stroke:rgb(142, 38, 38);stroke-width:1.5px"/>
<text x="264" y="243" text-anchor="middle" style="fill:rgb(142, 38, 38);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">undo</text>

<!-- Step 5: Compensate Order -->
<rect x="40" y="218" width="190" height="75" rx="10" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11)"/>
<text x="135" y="241" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500">5. Cancel Order</text>
<text x="135" y="261" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">marks order #101 failed</text>
<text x="135" y="277" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:11px;font-weight:500">status = CANCELLED</text>

<!-- Bottom Summary -->
<rect x="40" y="322" width="700" height="44" rx="8" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90)"/>
<text x="390" y="344" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Key rule: Compensating transactions must be idempotent and retried until they succeed (they cannot fail permanently)</text>
</svg>
